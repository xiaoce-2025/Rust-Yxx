# 开发环境配置文件
# 生产环境请创建 production.toml 文件并修改相应配置

[server]
address = "0.0.0.0"
port = 8090

[wechat]
api_base_url = "https://api.weixin.qq.com"
oauth_app_id = "your_wechat_app_id"
oauth_app_secret = "your_wechat_app_secret"
redirect_uri = "http://localhost:8080/api/wechat/callback"
qr_bot_type = "test"

[security]
session_ttl_hours = 24

[cors]
allowed_origins = ["http://localhost:3000", "http://localhost:8080"]
allow_credentials = true

# 阿里云语音识别配置
# 请在此处填写您的DASHSCOPE API Key
# 或者通过环境变量 DASHSCOPE_API_KEY 设置
[audioapi_paraformer]
api_key = "sk-b79a9ffcdcf141a1aeee64712a55c6a6"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "paraformer-v1"
upload_url = "https://dashscope.aliyuncs.com/api/v1/uploads"
transcription_url = "https://dashscope.aliyuncs.com/api/v1/services/audio/asr/transcription"
task_query_url = "https://dashscope.aliyuncs.com/api/v1/tasks"
max_retries = 120

# DeepSeek LLM 配置
# 请在此处填写您的 DeepSeek API Key
# 或者通过环境变量 DEEPSEEK_API_KEY 设置
[llm_deepseek]
api_key = "sk-d4928af4b4c84efda129cf3a904d41da"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"

# PKU Video 配置
[pkuvideo]
m3u8_concurrency = 4
m3u8_segment_timeout_seconds = 120

# FW 视频翻译：复用现有 Paraformer-v2 / DeepSeek，新增 MiMo。
# 密钥推荐使用服务器环境变量 MIMO_API_KEY，不提交到仓库。
[video_translation]
enabled = true
mimo_base_url = "https://api.xiaomimimo.com/v1"
mimo_model = "mimo-v2.5-tts"
voice = "苏打"
max_speed = 1.15
asr_timeout_seconds = 21600
# 独立翻译批次与配音块并发；遇到账号限流可降低。
translation_concurrency = 8
tts_concurrency = 8
# MiMo官方默认额度为100 RPM；如账号实际额度不同可覆盖。
tts_requests_per_minute = 100
# 用同一 Paraformer-v2 再识别最终配音以校准中文字幕；会产生额外 ASR 用量。
refine_subtitles = false
