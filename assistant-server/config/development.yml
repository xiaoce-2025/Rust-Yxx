# 开发环境配置文件
# 生产环境请创建 production.yml 文件并修改相应配置

server:
  address: "0.0.0.0"
  port: 8080

wechat:
  api_base_url: "https://api.weixin.qq.com"
  oauth_app_id: "your_wechat_app_id"
  oauth_app_secret: "your_wechat_app_secret"
  redirect_uri: "http://localhost:8080/api/wechat/callback"
  qr_bot_type: "test"

security:
  session_ttl_hours: 24

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allow_credentials: true

# 阿里云语音识别配置
# 请在此处填写您的DASHSCOPE API Key
# 或者通过环境变量 DASHSCOPE_API_KEY 设置
paraformer:
  api_key: "your_dashscope_api_key_here"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  websocket_url: "wss://dashscope.aliyuncs.com/api-ws/v1/inference"
  model: "paraformer-v1"