<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史任务 | 「严小希」小助手</title>
  <style>
    :root { --ink:#33252a; --muted:#826e74; --line:#eadfdf; --accent:#84384d; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fffaf7; color:var(--ink); font:14px/1.5 Arial,"Microsoft YaHei",sans-serif; }
    main { width:min(1280px,calc(100% - 32px)); margin:28px auto 48px; }
    h1 { margin:0; font-size:25px; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .intro { color:var(--muted); margin:5px 0 18px; font-size:13px; }
    button,input,select { font:inherit; border:1px solid var(--line); border-radius:6px; padding:7px 10px; background:#fff; color:var(--ink); }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
    .filters input { width:280px; max-width:100%; }
    #summary { margin-left:auto; color:var(--muted); font-size:12px; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:#fff; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
    th { background:#f8efed; color:#75545f; font-weight:600; white-space:nowrap; }
    th,td { padding:9px 12px; border-bottom:1px solid #f0e8e7; vertical-align:top; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#fffaf8; }
    .time { white-space:nowrap; color:var(--muted); font-size:12px; }
    .task-id { display:block; font:11px/1.6 Consolas,monospace; color:var(--muted); overflow-wrap:anywhere; }
    .subject { min-width:200px; }
    .subject small { display:block; color:var(--muted); }
    .state { display:inline-block; padding:2px 7px; border-radius:4px; background:#f0edeb; white-space:nowrap; font-size:12px; }
    .state.succeeded { background:#edf5ee; color:#3d6d48; }
    .state.failed { background:#faeded; color:#a0414b; }
    .state.running { background:#fbf0dd; color:#8c6628; }
    .reason { display:block; max-width:250px; margin-top:4px; color:var(--muted); font-size:12px; }
    .number { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .empty { padding:32px; text-align:center; color:var(--muted); }
    .pager { display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:12px; color:var(--muted); font-size:12px; }
    #feedback { color:#a0414b; margin:8px 0; }
    .priority { display:block; margin:4px 0; color:var(--muted); font-size:12px; white-space:nowrap; }
    .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    dialog { width:min(440px,calc(100% - 32px)); padding:24px; border:1px solid var(--line); border-radius:12px; color:var(--ink); }
    dialog::backdrop { background:#33252a66; }
    dialog h2 { margin:0 0 8px; font-size:20px; }
    .wait-times { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0; }
    .wait-times div { background:#f8efed; border-radius:8px; padding:12px; }
    .wait-times dt { color:var(--muted); font-size:12px; }
    .wait-times dd { margin:0; font-size:18px; font-weight:700; }
    .savings { color:var(--accent); font-size:24px; font-weight:700; margin:12px 0; }
    .dialog-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
    #acceleration-error { color:#a0414b; }
    @media(max-width:600px) { main { width:calc(100% - 20px); margin-top:20px; } th,td { padding:8px; } #summary { width:100%;margin-left:0; } }
  </style>
</head>
<body>
  <main>
    <div class="heading"><h1>历史任务</h1><div><a href="/recharge#acceleration">购买加速券</a>　<button id="refresh" type="button">刷新记录</button></div></div>
    <p class="intro">查看课堂笔记队列记录，或对指定的排队任务使用加速券。</p>
    <div class="filters">
      <input id="search" type="search" placeholder="搜索任务 ID、课程名称或日期" aria-label="搜索历史任务">
      <select id="source" aria-label="任务来源"><option value="all">全部来源</option><option value="direct">直链任务</option><option value="course">课程课节</option></select>
      <select id="status" aria-label="任务状态"><option value="all">全部状态</option><option value="pending">排队中</option><option value="running">处理中 / 结算中</option><option value="succeeded">已完成</option><option value="failed">失败</option></select>
      <span id="summary" role="status">正在读取记录…</span>
    </div>
    <p id="feedback" role="alert" hidden></p>
    <p id="acceleration-result" role="status" hidden></p>
    <div class="table-wrap"><table>
      <thead><tr><th>提交时间</th><th>任务 / 来源</th><th>状态</th><th>完成时间</th><th>视频时长</th><th>已扣希元（点）</th><th>文件状态</th></tr></thead>
      <tbody id="records"><tr><td class="empty" colspan="7">正在读取记录…</td></tr></tbody>
    </table></div>
    <div class="pager"><button id="previous" type="button">上一页</button><span id="page">1 / 1</span><button id="next" type="button">下一页</button></div>
  </main>
  <dialog id="acceleration-dialog" aria-labelledby="acceleration-title">
    <h2 id="acceleration-title">使用加速券</h2>
    <p id="acceleration-task"></p>
    <p id="acceleration-loading" role="status">正在读取排队预估…</p>
    <div id="acceleration-quote" hidden>
      <dl class="wait-times">
        <div><dt>当前预计排队</dt><dd id="wait-current"></dd></div>
        <div><dt>加速后预计排队</dt><dd id="wait-accelerated"></dd></div>
      </dl>
      <p class="savings" id="wait-saved"></p>
      <p class="intro">实际等待时间取决于队列处理进度。使用 1 张可将此任务提升至 2 级。</p>
      <p id="acceleration-balance"></p>
      <a id="acceleration-buy" href="/recharge#acceleration" hidden>购买加速券</a>
    </div>
    <p id="acceleration-error" role="alert" hidden></p>
    <form method="dialog" class="dialog-actions">
      <button id="acceleration-cancel" autofocus>取消</button>
      <button id="acceleration-confirm" type="button" class="primary" disabled>确认使用 1 张</button>
    </form>
  </dialog>
  <!-- site-footer -->
  <script>
    const $=id=>document.getElementById(id);
    let records=[],page=1,loading=false;
    let quoteRequest=0,selectedJob=null,redeeming=false;
    const pageSize=25;
    const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—';
    function duration(seconds) {
      if (!Number.isInteger(seconds)||seconds<=0) return '—';
      return `${Math.floor(seconds/3600)}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    }
    function render() {
      const query=$('search').value.trim().toLowerCase();
      const filtered=records.filter(job=>(!query||[job.id,job.course_name,job.course_date].some(value=>String(value||'').toLowerCase().includes(query)))
        && ($('source').value==='all'||($('source').value==='course')===Boolean(job.course_id))
        && ($('status').value==='all'||job.status===$('status').value));
      const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages);
      $('summary').textContent=`共 ${records.length} 条记录 · 筛选后 ${filtered.length} 条`;
      $('records').innerHTML=filtered.slice((page-1)*pageSize,page*pageSize).map(job=> {
        const pending=job.billing_state==='BILLING_PENDING';
        const label=pending?'结算待恢复':({pending:'排队中',running:'处理中',succeeded:'已完成',failed:'失败'})[job.status]||job.status;
        const subject=job.course_id?(job.course_name||'课程课节'):'直链任务';
        const source=job.course_id?`课程课节${job.course_date?' · '+job.course_date:''}`:'课堂笔记生成 / 直链';
        const reason=job.error||job.failure_code||'';
        const priority=Number.isInteger(job.priority)?`<small class="priority">${job.priority} 级${job.acceleration_used?' · 已加速':''}</small>`:'';
        const accelerate=job.can_accelerate?`<button type="button" data-accelerate="${escapeHTML(job.id)}">使用加速券</button>`:'';
        return `<tr><td class="time">${escapeHTML(date(job.created_at))}</td><td class="subject">${escapeHTML(subject)}${job.regenerate?' · 重新生成':''}<small>${escapeHTML(source)}</small><span class="task-id">${escapeHTML(job.id)}</span></td><td><span class="state ${escapeHTML(job.status)}">${escapeHTML(label)}</span>${priority}${accelerate}${reason?`<span class="reason">${escapeHTML(reason)}</span>`:''}</td><td class="time">${escapeHTML(date(job.finished_at))}</td><td class="number">${duration(job.billing_duration_seconds)}</td><td class="number">${escapeHTML(job.charged_units||0)}</td><td>${job.course_id?'课程页面管理':job.artifacts_deleted_at?'已删除文件':'直链页面管理'}</td></tr>`;
      }).join('')||'<tr><td class="empty" colspan="7">暂无匹配的任务记录</td></tr>';
      $('page').textContent=`${page} / ${pages}`;$('previous').disabled=page<=1;$('next').disabled=page>=pages;
    }
    const dialog=$('acceleration-dialog');
    const endpoint=id=>'/api/video-task-history/'+encodeURIComponent(id)+'/acceleration';
    async function accelerationApi(url,options={}) {
      const response=await fetch(url,{cache:'no-store',...options});
      if (response.status===401) throw new Error('登录已失效，请重新登录');
      const data=await response.json();
      if (!response.ok) throw new Error(data.error||'加速券请求失败，请稍后重试');
      return data;
    }
    function showAccelerationError(error) {
      $('acceleration-error').textContent=error.message;
      $('acceleration-error').hidden=false;
    }
    $('records').addEventListener('click',async event=>{
      const id=event.target.closest('[data-accelerate]')?.dataset.accelerate;
      const job=records.find(job=>job.id===id);
      if (!job?.can_accelerate||dialog.open) return;
      const request=++quoteRequest;
      selectedJob=id;
      $('acceleration-task').textContent=[job.course_name||'直链任务',job.course_date,id].filter(Boolean).join(' · ');
      $('acceleration-result').hidden=true;
      $('acceleration-error').hidden=true;
      $('acceleration-quote').hidden=true;
      $('acceleration-loading').hidden=false;
      $('acceleration-confirm').disabled=true;
      dialog.showModal();
      try {
        const [estimate,wallet]=await Promise.all([accelerationApi(endpoint(id)),accelerationApi('/api/acceleration/tickets')]);
        if (!dialog.open||request!==quoteRequest) return;
        $('wait-current').textContent=estimate.current_minutes+' 分钟';
        $('wait-accelerated').textContent=estimate.accelerated_minutes+' 分钟';
        $('wait-saved').textContent='预计节省 '+estimate.saved_minutes+' 分钟';
        $('acceleration-balance').textContent='持有 '+wallet.tickets+' 张加速券';
        $('acceleration-buy').hidden=wallet.tickets>0;
        $('acceleration-quote').hidden=false;
        $('acceleration-confirm').disabled=wallet.tickets<=0;
      } catch(error) {
        if (dialog.open&&request===quoteRequest) showAccelerationError(error);
        refresh();
      } finally {
        if (request===quoteRequest) $('acceleration-loading').hidden=true;
      }
    });
    dialog.addEventListener('cancel',event=>{if (redeeming) event.preventDefault();});
    $('acceleration-confirm').addEventListener('click',async ()=>{
      if (!dialog.open||redeeming||$('acceleration-confirm').disabled) return;
      redeeming=true;
      $('acceleration-error').hidden=true;
      $('acceleration-confirm').disabled=true;
      $('acceleration-cancel').disabled=true;
      try {
        await accelerationApi(endpoint(selectedJob),{method:'POST',headers:{'Content-Type':'application/json'},body:'null'});
        const job=records.find(job=>job.id===selectedJob);
        if (job) Object.assign(job,{priority:2,acceleration_used:true,can_accelerate:false});
        render();
        dialog.close();
        $('acceleration-result').textContent='已使用 1 张加速券，任务优先级已提升至 2 级。';
        $('acceleration-result').hidden=false;
      } catch(error) {
        showAccelerationError(error);
      } finally {
        redeeming=false;
        $('acceleration-cancel').disabled=false;
        refresh();
      }
    });
    async function refresh() {
      if (loading) return;loading=true;$('refresh').disabled=true;
      try {
        const response=await fetch('/api/video-task-history',{cache:'no-store',credentials:'same-origin'});
        if (!response.ok) throw new Error(response.status===401?'登录已失效，请重新登录':'暂时无法读取任务记录，请稍后重试');
        const data=await response.json();if (!Array.isArray(data)) throw new Error('任务记录格式无效');
        records=data;$('feedback').hidden=true;render();
      } catch(error) {$('feedback').textContent=error.message;$('feedback').hidden=false;}
      finally {loading=false;$('refresh').disabled=false;}
    }
    for (const id of ['search','source','status']) $(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render();});
    $('refresh').addEventListener('click',refresh);
    $('previous').addEventListener('click',()=>{page--;render();});$('next').addEventListener('click',()=>{page++;render();});
    refresh();
    setInterval(()=>{if (!document.hidden&&records.some(job=>['pending','running'].includes(job.status))) refresh();},10000);
  </script>
</body>
</html>
