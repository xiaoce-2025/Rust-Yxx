<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | 「严小希」小助手</title>
  <link rel="stylesheet" href="/auth/iaaa-login.css" />
</head>
<body>
  <main id="accountView" class="main auth-layout">
    <header class="top">
      <a href="/auth" class="brand">「严小希」小助手</a>
      <p class="tip">严小希账户登录</p>
    </header>
    <div class="mid">
      <aside class="welcome"><img src="/auth/login-picture.png" width="1672" height="941" alt="严小希校园插画：学习路上，小希与你相伴。" /></aside>
      <section class="single_col_panel" aria-label="严小希账户">
        <div class="row" role="tablist" aria-label="账户操作">
          <div class="row_50 center row-title"><button type="button" id="tabLogin" class="current" role="tab" aria-controls="loginForm" aria-selected="true">登录</button></div>
          <div class="row_50 center row-title"><button type="button" id="tabRegister" role="tab" aria-controls="registerForm" aria-selected="false">注册</button></div>
        </div>
        <form id="loginForm" role="tabpanel" aria-labelledby="tabLogin">
          <div class="row"><label class="sr-only" for="loginEmail">邮箱</label><input class="input-txt-row" id="loginEmail" type="email" placeholder="邮箱" autocomplete="username" required /></div>
          <div class="row"><label class="sr-only" for="loginPassword">严小希账户密码</label><input class="input-txt-row" id="loginPassword" type="password" placeholder="严小希账户密码" autocomplete="current-password" required /></div>
          <div class="row-thin"><p class="tip auth-note">使用严小希账户的邮箱和密码登录。</p></div>
          <div class="row"><button class="input-btn-row" type="submit">登录严小希小助手</button></div>
        </form>
        <form id="registerForm" style="display:none;" role="tabpanel" aria-labelledby="tabRegister">
          <div class="row"><label class="sr-only" for="regName">用户名</label><input class="input-txt-row" id="regName" placeholder="用户名" autocomplete="nickname" required /></div>
          <div class="row"><label class="sr-only" for="regEmail">学号邮箱</label><input class="input-txt-row" id="regEmail" type="email" placeholder="学号邮箱" autocomplete="email" required /></div>
          <div class="row"><label class="sr-only" for="regPassword">设置严小希账户密码</label><input class="input-txt-row" id="regPassword" type="password" placeholder="设置严小希账户密码" autocomplete="new-password" required /></div>
          <div class="row-thin"><p class="tip auth-note">请使用白名单中的学号邮箱注册，并设置严小希账户密码。</p></div>
          <div class="row"><button class="input-btn-row" type="submit">注册并登录</button></div>
        </form>
        <div class="row-thin"><p id="status" class="auth-status pku-red" role="status" aria-live="polite"></p></div>
        <div class="row center"><button type="button" id="useIaaa" class="account-switch">通过IAAA登录</button></div>
      </section>
    </div>
    <footer class="bottom"><div class="lx_info"><span>「严小希」小助手</span><span>由 cxxdgc 开发</span></div></footer>
  </main>

  <main id="iaaaView" class="main auth-layout" hidden>
    <header class="top">
      <a href="/auth" class="brand">「严小希」小助手</a>
      <p class="tip">IAAA 账号认证</p>
    </header>
    <div class="mid">
      <aside class="welcome"><img src="/auth/login-picture.png" width="1672" height="941" alt="严小希校园插画：学习路上，小希与你相伴。" /></aside>
      <section class="single_col_panel" aria-label="IAAA 登录">
        <div class="row" role="tablist" aria-label="登录方式">
          <div class="row_50 center row-title"><button type="button" id="iaaaAccountTab" role="tab" aria-controls="iaaaForm" aria-selected="true" class="current">账号登录</button></div>
          <div class="row_50 center row-title"><button type="button" id="iaaaQrTab" role="tab" aria-controls="iaaaQrPanel" aria-selected="false">扫码登录</button></div>
        </div>
        <form id="iaaaForm" role="tabpanel" aria-labelledby="iaaaAccountTab">
          <div class="row"><label class="sr-only" for="iaaaUsername">学号</label><input class="input-txt-row" id="iaaaUsername" name="username" type="text" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="学号" autocomplete="username" required /></div>
          <div class="row"><label class="sr-only" for="iaaaPassword">IAAA 密码</label><input class="input-txt-row" id="iaaaPassword" name="password" type="password" placeholder="IAAA 密码（与教学网一致）" autocomplete="current-password" required /></div>
          <div class="row-thin"><p class="tip auth-note">使用北京大学 IAAA 账号密码认证，成功后登录对应学号邮箱账户。首次使用须通过注册白名单校验。</p></div>
          <div class="row"><button class="input-btn-row" id="iaaaSubmit" type="submit">登录严小希小助手</button></div>
        </form>
        <div id="iaaaQrPanel" role="tabpanel" aria-labelledby="iaaaQrTab" hidden><div class="row center coming-soon"><p class="pku-red">敬请期待</p><p class="tip">严小希小助手扫码登录即将上线</p></div></div>
        <div class="row-thin"><p id="iaaaStatus" role="status" aria-live="polite" class="pku-red"></p></div>
        <div class="row center"><button type="button" id="useAccount" class="account-switch">通过严小希账户登录</button></div>
      </section>
    </div>
    <footer class="bottom"><div class="lx_info"><span>「严小希」小助手</span><span>由 cxxdgc 开发</span></div></footer>
  </main>

  <style>
    [hidden] { display: none !important; }
    body { display: block; margin: 0; min-height: 100vh; background: #fff; color: #222; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .auth-layout .brand { color: #9b0000; font-size: 30px; font-weight: bold; }
    .auth-layout { width: min(980px, calc(100% - 48px)); }
    .auth-layout .mid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; align-items: center; float: none; }
    .auth-layout .welcome { width: 100%; min-width: 0; }
    .auth-layout .welcome img { display: block; width: 100%; height: auto; object-fit: contain; }
    .auth-layout .single_col_panel { float: none; width: 280px; margin: 0; }
    .auth-layout button { font-family: inherit; }
    .auth-layout .row-title button { border: 0; background: transparent; color: #222; font-size: 18px; padding: 0; cursor: pointer; }
    .auth-layout .row-title button.current { color: #9b0000; }
    .auth-layout .auth-note { font-size: 13px; line-height: 1.8; margin: 8px 0; }
    .auth-layout .account-switch { border: 0; background: transparent; color: #9b0000; font-size: 14px; padding: 5px 0; cursor: pointer; }
    .auth-layout .coming-soon { min-height: 220px; padding-top: 55px; }
    .auth-status, #iaaaStatus { min-height: 20px; font-size: 13px; line-height: 1.6; margin: 6px 0; overflow-wrap: anywhere; }
    .auth-layout .lx_info { width: auto; text-align: center; }
    .auth-layout :focus-visible { outline: 2px solid #9b0000; outline-offset: 3px; }
    .auth-layout input:focus, .auth-layout input:focus-visible { outline: none; box-shadow: none; border-color: #9b0000; }
    .auth-layout button:disabled { opacity: .6; cursor: wait; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-width: 700px) {
      .auth-layout { width: calc(100% - 32px); }
      .auth-layout .top { margin: 24px 0; text-align: center; }
      .auth-layout .mid { grid-template-columns: minmax(0, 1fr); gap: 24px; height: auto; min-height: 0; }
      .auth-layout .single_col_panel { width: 100%; max-width: 360px; justify-self: center; }
      .auth-layout .welcome { grid-row: 2; max-width: 520px; justify-self: center; }
      .auth-layout .brand { font-size: 25px; }
    }
  </style>

  <script>
    const statusEl = document.getElementById("status");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const requestedNext = new URLSearchParams(location.search).get("next") || "/app";
    let next = "/app";
    try {
      const nextUrl = new URL(requestedNext, location.origin);
      if (nextUrl.origin === location.origin && ["http:", "https:"].includes(nextUrl.protocol)) {
        next = nextUrl.pathname + nextUrl.search + nextUrl.hash;
      }
    } catch (_) {}

    function setTab(name) {
      const isLogin = name === "login";
      loginForm.style.display = isLogin ? "block" : "none";
      registerForm.style.display = isLogin ? "none" : "block";
      tabLogin.classList.toggle("current", isLogin);
      tabLogin.setAttribute("aria-selected", String(isLogin));
      tabRegister.classList.toggle("current", !isLogin);
      tabRegister.setAttribute("aria-selected", String(!isLogin));
      statusEl.textContent = "";
    }

    async function callApi(path, body) {
      const res = await fetch(path, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    tabLogin.addEventListener("click", () => setTab("login"));
    tabRegister.addEventListener("click", () => setTab("register"));

    const iaaaForm = document.getElementById("iaaaForm");
    const iaaaStatus = document.getElementById("iaaaStatus");
    function setLoginMode(iaaa) {
      document.getElementById("accountView").hidden = iaaa;
      document.getElementById("iaaaView").hidden = !iaaa;
      document.getElementById("iaaaPassword").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("regPassword").value = "";
      iaaaStatus.textContent = "";
      if (!iaaa) setTab("login");
      document.getElementById(iaaa ? "iaaaUsername" : "loginEmail").focus();
    }
    document.getElementById("useIaaa").addEventListener("click", () => setLoginMode(true));
    document.getElementById("useAccount").addEventListener("click", () => setLoginMode(false));
    function setIaaaTab(qr) {
      iaaaForm.hidden = qr;
      document.getElementById("iaaaQrPanel").hidden = !qr;
      for (const [id, selected] of [["iaaaAccountTab", !qr], ["iaaaQrTab", qr]]) {
        const tab = document.getElementById(id);
        tab.classList.toggle("current", selected);
        tab.setAttribute("aria-selected", String(selected));
      }
      document.getElementById("iaaaPassword").value = "";
      iaaaStatus.textContent = "";
    }
    document.getElementById("iaaaAccountTab").addEventListener("click", () => setIaaaTab(false));
    document.getElementById("iaaaQrTab").addEventListener("click", () => setIaaaTab(true));
    iaaaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = document.getElementById("iaaaSubmit");
      if (button.disabled) return;
      button.disabled = true;
      iaaaStatus.textContent = "IAAA 认证中…";
      try {
        await callApi("/api/auth/iaaa", {
          username: document.getElementById("iaaaUsername").value.trim(),
          password: document.getElementById("iaaaPassword").value
        });
        location.href = next;
      } catch (err) {
        iaaaStatus.textContent = "登录失败：" + err.message;
      } finally {
        document.getElementById("iaaaPassword").value = "";
        button.disabled = false;
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "登录中...";
      try {
        await callApi("/api/auth/login", {
          email: document.getElementById("loginEmail").value.trim(),
          password: document.getElementById("loginPassword").value
        });
        location.href = next;
      } catch (err) {
        statusEl.textContent = "登录失败: " + err.message;
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "注册中...";
      try {
        await callApi("/api/auth/register", {
          username: document.getElementById("regName").value.trim(),
          email: document.getElementById("regEmail").value.trim(),
          password: document.getElementById("regPassword").value
        });
        location.href = next;
      } catch (err) {
        statusEl.textContent = "注册失败: " + err.message;
      }
    });

    fetch("/api/auth/me", { credentials: "include" }).then((r) => {
      if (r.ok) location.href = next;
    }).catch(() => {});
  </script>
</body>
</html>
