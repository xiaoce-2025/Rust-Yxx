<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | 「严小希」小助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <link id="iaaaStyle" rel="stylesheet" href="/auth/iaaa-login.css" disabled />
  <style id="accountStyle">
    :root {
      --bg: #e8efe7;
      --ink: #10221c;
      --panel: rgba(255,255,255,.82);
      --line: rgba(16,34,28,.16);
      --accent: #0e7f5b;
      --accent2: #ca5f27;
      --warn: #8f2437;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(42rem 24rem at 15% -10%, rgba(202,95,39,.2), transparent 56%),
        radial-gradient(55rem 28rem at 110% 110%, rgba(14,127,91,.25), transparent 56%),
        linear-gradient(135deg, #eef3ec, var(--bg));
    }
    .auth-card {
      width: min(520px, 92vw);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: 0 24px 44px rgba(0,0,0,.12);
      padding: 22px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
    }
    .sub {
      margin-top: 6px;
      color: #4f615a;
      font-size: 13px;
    }
    .tabs { margin-top: 16px; display: flex; gap: 8px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .tab { flex: 1; background: #edf4f1; color: var(--ink); }
    .tab.active { background: var(--accent); color: #fff; }
    .alt { background: var(--accent2); color: #fff; }
    .field { margin-top: 10px; }
    .field label { font-size: 12px; color: #506059; display: block; margin-bottom: 4px; }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      background: #fff;
    }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    .row button { flex: 1; }
    .status { min-height: 18px; margin-top: 10px; color: var(--warn); font-size: 12px; }
    .next { margin-top: 12px; font-size: 12px; color: #60736a; }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1>「严小希」小助手</h1>
    <div class="sub">欢迎使用「严小希」小助手！本项目由cxxdgc开发~</div>

    <div class="tabs">
      <button id="tabLogin" class="tab active">登录</button>
      <button id="tabRegister" class="tab">注册</button>
    </div>

    <form id="loginForm">
      <div class="field"><label for="loginEmail">邮箱</label><input id="loginEmail" type="email" required /></div>
      <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" required /></div>
      <div class="row"><button type="submit">登录</button></div>
    </form>

    <form id="registerForm" style="display:none;">
      <div class="field"><label for="regName">用户名</label><input id="regName" required /></div>
      <div class="field">
        <label for="regEmail">邮箱 (请使用学号邮箱)</label>
        <input id="regEmail" type="email" placeholder="2x000xxxxx@pku.edu.cn" required />
      </div>
      <div class="field"><label for="regPassword">密码</label><input id="regPassword" type="password" required /></div>
      <div class="row"><button type="submit" class="alt">注册并登录</button></div>
    </form>

    <div id="status" class="status"></div>
    <div class="next">登录后将跳转到 <span id="nextPath"></span></div>
    <div class="row"><button type="button" id="useIaaa">通过IAAA登录</button></div>
  </main>

  <main id="iaaaView" class="main" hidden>
    <header class="top">
      <a href="/auth" class="brand">「严小希」小助手</a>
      <p class="tip">IAAA 账号认证</p>
    </header>
    <div class="mid">
      <aside class="welcome"><img src="/auth/login-picture.png" width="1672" height="941" alt="严小希校园插画：学习路上，小希与你相伴。" /></aside>
      <section class="single_col_panel" aria-label="IAAA 登录">
        <div class="row" role="tablist" aria-label="登录方式">
          <div class="row_50 center row-title"><button type="button" id="iaaaAccountTab" role="tab" aria-controls="iaaaForm" aria-selected="true" class="current">账号登录</button></div>
          <div class="row_50 center row-title"><button type="button" id="iaaaQrTab" role="tab" aria-controls="iaaaQrPanel" aria-selected="false">扫码登录</button></div>
        </div>
        <form id="iaaaForm" role="tabpanel" aria-labelledby="iaaaAccountTab">
          <div class="row"><label class="sr-only" for="iaaaUsername">学号</label><input class="input-txt-row" id="iaaaUsername" name="username" type="text" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="学号" autocomplete="username" required /></div>
          <div class="row"><label class="sr-only" for="iaaaPassword">IAAA 密码</label><input class="input-txt-row" id="iaaaPassword" name="password" type="password" placeholder="IAAA 密码（与教学网一致）" autocomplete="current-password" required /></div>
          <div class="row-thin"><p class="tip auth-note">使用北京大学 IAAA 账号密码认证，成功后登录对应学号邮箱账户。首次使用须通过注册白名单校验。</p></div>
          <div class="row"><button class="input-btn-row" id="iaaaSubmit" type="submit">登录严小希小助手</button></div>
        </form>
        <div id="iaaaQrPanel" role="tabpanel" aria-labelledby="iaaaQrTab" hidden><div class="row center coming-soon"><p class="pku-red">敬请期待</p><p class="tip">严小希小助手扫码登录即将上线</p></div></div>
        <div class="row-thin"><p id="iaaaStatus" role="status" aria-live="polite" class="pku-red"></p></div>
        <div class="row center"><button type="button" id="useAccount" class="account-switch">通过严小希账户登录</button></div>
      </section>
    </div>
    <footer class="bottom"><div class="lx_info"><span>「严小希」小助手</span><span>由 cxxdgc 开发</span></div></footer>
  </main>

  <style>
    [hidden] { display: none !important; }
    body.iaaa-mode { display: block; margin: 0; min-height: 100vh; background: #fff; color: #222; font-family: Arial, "Microsoft YaHei", sans-serif; }
    #iaaaView .brand { color: #9b0000; font-size: 30px; font-weight: bold; }
    #iaaaView { width: min(980px, calc(100% - 48px)); }
    #iaaaView .mid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; align-items: center; float: none; }
    #iaaaView .welcome { width: 100%; min-width: 0; }
    #iaaaView .welcome img { display: block; width: 100%; height: auto; object-fit: contain; }
    #iaaaView .single_col_panel { float: none; width: 280px; margin: 0; }
    #iaaaView button { font-family: inherit; }
    #iaaaView .row-title button { border: 0; background: transparent; color: #222; font-size: 18px; padding: 0; cursor: pointer; }
    #iaaaView .row-title button.current { color: #9b0000; }
    #iaaaView .auth-note { font-size: 13px; line-height: 1.8; margin: 8px 0; }
    #iaaaView .account-switch { border: 0; background: transparent; color: #9b0000; font-size: 14px; padding: 5px 0; cursor: pointer; }
    #iaaaView .coming-soon { min-height: 220px; padding-top: 55px; }
    #iaaaStatus { min-height: 20px; font-size: 13px; line-height: 1.6; margin: 6px 0; overflow-wrap: anywhere; }
    #iaaaView .lx_info { width: auto; text-align: center; }
    #iaaaView :focus-visible { outline: 2px solid #9b0000; outline-offset: 3px; }
    #iaaaView input:focus, #iaaaView input:focus-visible { outline: none; box-shadow: none; border-color: #9b0000; }
    .auth-card input:focus, .auth-card input:focus-visible { outline: none; box-shadow: none; border-color: var(--accent); }
    #iaaaView button:disabled { opacity: .6; cursor: wait; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-width: 700px) {
      #iaaaView { width: calc(100% - 32px); }
      #iaaaView .top { margin: 24px 0; text-align: center; }
      #iaaaView .mid { grid-template-columns: minmax(0, 1fr); gap: 24px; height: auto; min-height: 0; }
      #iaaaView .single_col_panel { width: 100%; max-width: 360px; justify-self: center; }
      #iaaaView .welcome { grid-row: 2; max-width: 520px; justify-self: center; }
      #iaaaView .brand { font-size: 25px; }
    }
  </style>

  <script>
    const statusEl = document.getElementById("status");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const requestedNext = new URLSearchParams(location.search).get("next") || "/app";
    let next = "/app";
    try {
      const nextUrl = new URL(requestedNext, location.origin);
      if (nextUrl.origin === location.origin && ["http:", "https:"].includes(nextUrl.protocol)) {
        next = nextUrl.pathname + nextUrl.search + nextUrl.hash;
      }
    } catch (_) {}
    document.getElementById("nextPath").textContent = next;

    function setTab(name) {
      const isLogin = name === "login";
      loginForm.style.display = isLogin ? "block" : "none";
      registerForm.style.display = isLogin ? "none" : "block";
      tabLogin.classList.toggle("active", isLogin);
      tabRegister.classList.toggle("active", !isLogin);
      statusEl.textContent = "";
    }

    async function callApi(path, body) {
      const res = await fetch(path, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    tabLogin.addEventListener("click", () => setTab("login"));
    tabRegister.addEventListener("click", () => setTab("register"));

    const iaaaForm = document.getElementById("iaaaForm");
    const iaaaStatus = document.getElementById("iaaaStatus");
    function setLoginMode(iaaa) {
      document.querySelector(".auth-card").hidden = iaaa;
      document.getElementById("iaaaView").hidden = !iaaa;
      document.getElementById("accountStyle").sheet.disabled = iaaa;
      document.getElementById("iaaaStyle").disabled = !iaaa;
      document.body.classList.toggle("iaaa-mode", iaaa);
      document.getElementById("iaaaPassword").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("regPassword").value = "";
      iaaaStatus.textContent = "";
      if (!iaaa) setTab("login");
      document.getElementById(iaaa ? "iaaaUsername" : "loginEmail").focus();
    }
    document.getElementById("useIaaa").addEventListener("click", () => setLoginMode(true));
    document.getElementById("useAccount").addEventListener("click", () => setLoginMode(false));
    function setIaaaTab(qr) {
      iaaaForm.hidden = qr;
      document.getElementById("iaaaQrPanel").hidden = !qr;
      for (const [id, selected] of [["iaaaAccountTab", !qr], ["iaaaQrTab", qr]]) {
        const tab = document.getElementById(id);
        tab.classList.toggle("current", selected);
        tab.setAttribute("aria-selected", String(selected));
      }
      document.getElementById("iaaaPassword").value = "";
      iaaaStatus.textContent = "";
    }
    document.getElementById("iaaaAccountTab").addEventListener("click", () => setIaaaTab(false));
    document.getElementById("iaaaQrTab").addEventListener("click", () => setIaaaTab(true));
    iaaaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = document.getElementById("iaaaSubmit");
      if (button.disabled) return;
      button.disabled = true;
      iaaaStatus.textContent = "IAAA 认证中…";
      try {
        await callApi("/api/auth/iaaa", {
          username: document.getElementById("iaaaUsername").value.trim(),
          password: document.getElementById("iaaaPassword").value
        });
        location.href = next;
      } catch (err) {
        iaaaStatus.textContent = "登录失败：" + err.message;
      } finally {
        document.getElementById("iaaaPassword").value = "";
        button.disabled = false;
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "登录中...";
      try {
        await callApi("/api/auth/login", {
          email: document.getElementById("loginEmail").value.trim(),
          password: document.getElementById("loginPassword").value
        });
        location.href = next;
      } catch (err) {
        statusEl.textContent = "登录失败: " + err.message;
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "注册中...";
      try {
        await callApi("/api/auth/register", {
          username: document.getElementById("regName").value.trim(),
          email: document.getElementById("regEmail").value.trim(),
          password: document.getElementById("regPassword").value
        });
        location.href = next;
      } catch (err) {
        statusEl.textContent = "注册失败: " + err.message;
      }
    });

    fetch("/api/auth/me", { credentials: "include" }).then((r) => {
      if (r.ok) location.href = next;
    }).catch(() => {});
  </script>
</body>
</html>
