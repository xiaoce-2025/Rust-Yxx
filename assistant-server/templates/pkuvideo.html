<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>「严小希」小助手-课堂笔记生成</title>
  <style>
    /* replay-hero */
    .workspace { padding: 16px var(--replay-gutter) 40px; }
    .panel {
      min-width: 0;
      padding: clamp(16px, 1.5vw, 24px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffafa;
      box-shadow: 0 5px 14px #4d17140b;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 14px;
    }
    .panel-heading h2, .panel-heading h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: clamp(17px, 1.35vw, 21px);
      font-weight: 600;
    }
    .panel-heading .icon, .file-row .icon { color: var(--accent); }
    .input-panel { max-width: 760px; margin-inline: auto; }
    .input-panel .sub { margin-bottom: 14px; }
    .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .field label { display: block; margin-bottom: 4px; color: var(--muted); }
    .field input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .field small { display: block; margin-top: 4px; color: var(--muted); }
    .field a { color: var(--accent); }
    .full { grid-column: 1 / -1; }
    .toolbar { margin-top: 16px; }
    button { border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; font: inherit; background: var(--accent); color: white; }
    button.ghost { color: var(--ink); background: #fffafa; border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { margin: 0 0 12px; color: var(--muted); }
    .status:empty { display: none; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-dialog {
      background: #fff; border-radius: 16px; padding: 24px; max-width: 520px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-dialog h3 { margin: 0 0 8px; }
    .modal-dialog p { font-size: 13px; color: #6b7280; margin: 0 0 12px; }
    .key-url-box { background: #f3f4f6; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .key-url-box a { font-size: 12px; word-break: break-all; color: var(--accent); }
    .modal-dialog textarea {
      width: 100%; height: 80px; border-radius: 8px; border: 1px solid var(--line);
      padding: 10px; font: inherit; font-size: 12px; resize: vertical;
    }
    .modal-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .drop-zone {
      border: 2px dashed var(--line); border-radius: 10px; padding: 20px;
      text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 12px;
      transition: border-color .2s, background .2s; cursor: pointer;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: #fce5e5; }
    .drop-zone.loaded { border-color: var(--accent); border-style: solid; background: #fdf3f3; }
    .drop-zone.loaded .drop-icon { color: var(--accent); }
    .key-hint { font-size: 12px; min-height: 18px; margin: -8px 0 8px; }
    .key-hint.ok { color: var(--accent); }
    .key-hint.err { color: var(--warn); }
    .notes-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); gap: 16px; max-width: 1200px; margin: 0 auto; align-items: start; }
    .notes-layout .input-panel { width: 100%; max-width: none; margin: 0; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .card { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: #fffafa; box-shadow: 0 5px 14px #4d17140b; }
    .card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    .notes-sidebar { display: grid; gap: 16px; }
    .steps { display: grid; gap: 8px; margin-top: 12px; }
    .step, .history-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; overflow-wrap: anywhere; }
    .history-item { margin-top: 12px; }
    .history-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .history-info { font-size: 13px; overflow-wrap: anywhere; }
    .history-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { padding: 7px 12px; border: 1px solid var(--line); background: #fffafa; color: var(--ink); font-size: 13px; }
    .action-btn:hover { background: #fce5e5; }
    .action-btn.delete { color: var(--warn); }
    .mono { font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
    #historySection { grid-column: 1 / -1; }
    #status { max-width: 1200px; margin: 0 auto 12px; }
    @media (max-width: 760px) { .notes-layout, .grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main>
    <!-- replay-hero -->
    <div class="workspace">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="notes-layout">
        <section class="panel input-panel" aria-labelledby="inputTitle">
          <div class="panel-heading"><h2 id="inputTitle">生成课堂笔记</h2></div>
          <p class="sub">输入课程回放下载链接，让严小希帮你记笔记。无需门户 IAAA 账号和密码；支持带 enc_key 参数的链接，自动读取密钥；普通加密 m3u8 链接仍可按提示提供密钥。</p>
          <div class="grid">
            <div class="field full">
              <label for="videoUrl">视频下载链接</label>
              <input id="videoUrl" type="url" placeholder="https://..." />
              <small>如何获取课程回放下载链接？<a href="https://www.cxxdgc.cn/blog/project/videodownload2025autumn_addition" target="_blank" rel="noopener">点此查看</a></small>
            </div>
          </div>
          <div class="toolbar">
            <button id="submitBtn">提交处理任务</button>
            <button id="historyBtn" class="ghost">查看历史记录</button>
            <button id="goAppBtn" class="ghost">返回首页</button>
          </div>
        </section>
        <div class="notes-sidebar">
          <section class="card" aria-labelledby="quotaTitle">
            <h2 id="quotaTitle">资源限额</h2>
            <div id="quotaInfo" class="mono">加载中...</div>
          </section>
          <section class="card" aria-labelledby="jobTitle">
            <h2 id="jobTitle">任务状态</h2>
            <div class="mono" id="jobMeta" role="status">尚未提交任务</div>
            <div class="steps" id="steps" aria-live="polite"></div>
          </section>
        </div>
        <section class="card" id="historySection" style="display: none;" aria-labelledby="historyTitle">
          <h2 id="historyTitle">历史任务记录</h2>
          <div id="historyList"></div>
        </section>
      </div>
    </div>
  <div class="modal-overlay" id="keyModal">
      <div class="modal-dialog">
        <h3>需要解密密钥</h3>
        <p>此视频为 m3u8 加密流，请点击下方链接在新页面中打开，或将下载的密钥文件拖入下方区域：</p>
        <div class="key-url-box">
          <a id="keyUrl" href="#" target="_blank"></a>
        </div>
        <div class="drop-zone" id="dropZone">
          <span id="dropHint">拖拽密钥文件到此处</span>
        </div>
        <textarea id="manualKey" placeholder="或在此粘贴密钥内容..." oninput="validateKey()"></textarea>
        <div id="keyHint" class="key-hint"></div>
        <div class="modal-actions">
          <button id="keyCancelBtn" class="ghost">取消</button>
          <button id="keyConfirmBtn">提交密钥</button>
        </div>
      </div>
    </div>
  </main>
  <!-- site-footer -->

  <script>
    const statusEl = document.getElementById("status");
    const jobMetaEl = document.getElementById("jobMeta");
    const stepsEl = document.getElementById("steps");
    const quotaInfoEl = document.getElementById("quotaInfo");
    let activeJobId = "";
    let pollTimer = null;
    let storageQuota = 0;
    let processingQuota = 0;

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    function esc(s) {
      return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function renderJob(job) {
      jobMetaEl.textContent = "";
      if (job.status === "succeeded") {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em; color: #22c55e;">处理完成！</div>';
        if (job.pdf_path) {
          stepsEl.innerHTML += '<div class="step" style="margin-top: 16px;"><button onclick="downloadPdf(\'' + job.id + '\')" class="action-btn" style="background: var(--accent); color: #fff; padding: 12px 24px; font-size: 1.1em;">下载 PDF</button></div>';
        }
      } else if (job.status === "failed") {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em; color: #ef4444;">处理失败: ' + esc(job.error || "未知错误") + '</div>';
      } else {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em;">正在执行中，请稍后...</div>';
      }
    }

    async function checkLogin() {
      try {
        const userInfo = await api("/api/auth/me");
        storageQuota = userInfo.storage_quota || 0;
        processingQuota = userInfo.processing_quota || 0;
        updateQuotaDisplay();
      } catch {
        location.href = "/auth?next=/pkuvideo";
      }
    }

    async function updateQuotaDisplay() {
      try {
        const userInfo = await api("/api/auth/me");
        storageQuota = userInfo.storage_quota || 0;
        processingQuota = userInfo.processing_quota || 0;
        quotaInfoEl.innerHTML = `储存资源限额: 3 | 剩余: ${storageQuota}<br/>处理资源限额: 1 | 剩余: ${processingQuota}`;
      } catch (err) {
        quotaInfoEl.textContent = `获取限额信息失败: ${err.message}`;
      }
    }

    // enc_key 是本项目的导入参数，提交前移除，避免发给视频资源服务器。
    function readVideoInput() {
      const value = document.getElementById("videoUrl").value.trim();
      const parsed = new URL(value);
      if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("请输入 http/https 视频链接");
      const keys = parsed.searchParams.getAll("enc_key");
      if (keys.length > 1) throw new Error("链接中存在重复的 enc_key 参数");
      const key = keys[0];
      if (key !== undefined && !(/^hex:/i.test(key) ? /^hex:[0-9a-f]{32}$/i.test(key) : new TextEncoder().encode(key).length === 16)) {
        throw new Error("链接中的 enc_key 必须是 16 字节密钥或 hex: 加 32 位十六进制编码");
      }
      const source = value.split("#")[0];
      const q = source.indexOf("?");
      let url = source;
      if (key !== undefined && q >= 0) {
        const query = source.slice(q + 1).split("&")
          .filter(part => decodeURIComponent(part.split("=")[0]) !== "enc_key").join("&");
        url = source.slice(0, q) + (query ? "?" + query : "");
      }
      return { url, key: key && /^hex:/i.test(key) ? "hex:" + key.slice(4).toLowerCase() : key };
    }

    async function submitJob(manualKey) {
      if (processingQuota <= 0) {
        statusEl.textContent = "提交失败: 处理资源限额不足，请联系管理员获取更多额度（严小希平均处理1小时的回放需要消耗价值0.5r的token，严小希并没有那么充足的应对攻击的资金qwq，设置限额是为了保障正常使用）";
        return;
      }

      let media;
      try { media = readVideoInput(); } catch (err) { statusEl.textContent = err.message; return; }
      statusEl.textContent = "提交中...";
      const body = { video_url: media.url };
      if (manualKey || media.key) body.manual_key = manualKey || media.key;

      api("/api/pkuvideo/submit-web", "POST", body)
        .then(resp => {
          activeJobId = resp.job_id;
          statusEl.textContent = "提交成功，任务已入队。";
          processingQuota -= 1;
          quotaInfoEl.innerHTML = `储存资源限额: 3 | 剩余: ${storageQuota}<br/>处理资源限额: 1 | 剩余: ${processingQuota}`;
          startPolling();
        })
        .catch(err => {
          statusEl.textContent = "提交失败: " + err.message;
          updateQuotaDisplay();
        });
    }

    async function checkM3u8AndSubmit() {
      let media;
      try { media = readVideoInput(); } catch (err) { statusEl.textContent = err.message; return; }
      const url = media.url;
      if (media.key || !url.includes(".m3u8")) return submitJob();

      statusEl.textContent = "正在检测视频加密信息...";
      try {
        const resp = await api("/api/pkuvideo/check-m3u8", "POST", {
          video_url: url
        });
        if (resp.error) throw new Error(resp.error);
        if (resp.is_m3u8 && resp.key_uri) {
          document.getElementById("keyUrl").href = resp.key_uri;
          document.getElementById("keyUrl").textContent = resp.key_uri;
          document.getElementById("manualKey").value = "";
          document.getElementById("keyModal").style.display = "flex";
        } else {
          submitJob();
        }
      } catch (err) {
        statusEl.textContent = "检测失败: " + err.message;
      }
    }

    document.getElementById("keyConfirmBtn").addEventListener("click", () => {
      const hint = document.getElementById("keyHint");
      const key = document.getElementById("manualKey").value.trim();
      if (!key) { hint.textContent = "请粘贴密钥内容或拖入文件"; hint.className = "key-hint err"; return; }
      if (new TextEncoder().encode(key).length > 20) {
        hint.textContent = "密钥过长（超过20字节）"; hint.className = "key-hint err";
        return;
      }
      document.getElementById("keyModal").style.display = "none";
      submitJob(key);
    });

    document.getElementById("keyCancelBtn").addEventListener("click", () => {
      document.getElementById("keyModal").style.display = "none";
      statusEl.textContent = "已取消";
    });

    function validateKey() {
      const key = document.getElementById("manualKey").value.trim();
      const hint = document.getElementById("keyHint");
      if (!key) { hint.textContent = ""; hint.className = "key-hint"; return; }
      const size = new TextEncoder().encode(key).length;
      if (size > 20) {
        hint.textContent = `密钥过长（${size} 字节，超过20字节上限）`;
        hint.className = "key-hint err";
      } else {
        hint.textContent = `密钥长度 ${size} 字节，格式正确`;
        hint.className = "key-hint ok";
      }
    }

    // --- 拖拽上传 ---
    const dropZone = document.getElementById("dropZone");
    const dropHint = document.getElementById("dropHint");
    const textarea = document.getElementById("manualKey");

    function handleDropFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result.trim();
        textarea.value = text;
        validateKey();
        dropHint.textContent = file.name;
        dropZone.classList.add("loaded");
      };
      reader.readAsText(file);
    }

    ['dragenter','dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    });
    ['dragleave','drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("drag-over"); });
    });
    dropZone.addEventListener("drop", e => {
      if (e.dataTransfer.files.length) handleDropFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.onchange = () => { if (input.files.length) handleDropFile(input.files[0]); };
      input.click();
    });

    async function pollJob() {
      if (!activeJobId) return;
      try {
        const job = await api("/api/pkuvideo/jobs/" + activeJobId);
        renderJob(job);
        if (job.status === "succeeded" || job.status === "failed") {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch (err) {
        statusEl.textContent = "查询任务失败: " + err.message;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollJob();
      pollTimer = setInterval(pollJob, 2000);
    }

    async function loadHistory() {
      try {
        const jobs = await api("/api/pkuvideo/jobs");
        const historyList = document.getElementById("historyList");
        
        if (jobs.length === 0) {
          historyList.innerHTML = "暂无历史任务记录";
        } else {
          historyList.innerHTML = jobs.map(job => {
            const statusText = job.status === "succeeded" ? "已完成" : (job.status === "failed" ? "失败" : "处理中");
            const statusColor = job.status === "succeeded" ? "#22c55e" : (job.status === "failed" ? "#ef4444" : "#eab308");
            return `
              <div class="history-item">
                <div class="history-header">
                  <span>创建时间: ${job.created_at}</span>
                  <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
                </div>
                <div class="history-info">
                  <div>视频链接: ${esc(job.video_url)}</div>
                  <div class="history-actions">
                    ${job.pdf_path ? `<button onclick="downloadPdf('${job.id}')" class="action-btn" style="background: var(--accent); color: #fff;">下载 PDF</button>` : ""}
                    ${job.tex_url ? `<button onclick="downloadPdf('${job.id}', 'tex')" class="action-btn">下载 TeX</button>` : ""}
                    <button onclick="deleteJob('${job.id}')" class="action-btn delete">删除任务</button>
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }
        
        document.getElementById("historySection").style.display = "block";
      } catch (err) {
        statusEl.textContent = "加载历史记录失败: " + err.message;
      }
    }

    async function deleteJob(jobId) {
      if (!confirm("确定要删除此任务吗？删除后将无法恢复，相关文件也会被删除。")) {
        return;
      }

      try {
        statusEl.textContent = "正在删除任务...";
        await api("/api/pkuvideo/jobs/" + jobId, "DELETE");
        statusEl.textContent = "任务删除成功";
        // 刷新限额信息和历史记录
        await updateQuotaDisplay();
        await loadHistory();
      } catch (err) {
        statusEl.textContent = "删除任务失败: " + err.message;
      }
    }

    async function downloadPdf(jobId, format = "pdf") {
      try {
        const response = await fetch(`/api/pkuvideo/jobs/${jobId}/${format}`, {
          method: "GET",
          credentials: "include"
        });
        if (!response.ok) {
          throw new Error("下载失败");
        }
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `lecture_notes_${jobId}.${format}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("下载失败: " + err.message);
      }
    }

    async function reexecuteStep(jobId, stepIndex) {
      try {
        statusEl.textContent = "正在提交重新生成任务...";
        const stepNames = ["download_video", "extract_mp3", "speech_to_text", "extract_notes", "compile_pdf"];
        const stepName = stepNames[stepIndex];
        
        const result = await api(`/api/pkuvideo/jobs/${jobId}/reexecute`, "POST", {
          step: stepIndex
        });
        
        statusEl.textContent = "重新生成任务已排队";
        if (result.job_id) { activeJobId = result.job_id; startPolling(); }
        // 重新加载历史记录以更新状态
        await loadHistory();
      } catch (err) {
        statusEl.textContent = "重新执行步骤失败: " + err.message;
      }
    }

    document.getElementById("goAppBtn").addEventListener("click", () => {
      location.href = "/";
    });
    document.getElementById("submitBtn").addEventListener("click", checkM3u8AndSubmit);
    document.getElementById("historyBtn").addEventListener("click", loadHistory);

    checkLogin();
  </script>
</body>
</html>
