<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>「严小希」小助手-工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13241d;
      --line: rgba(19,36,29,.18);
      --accent: #0c7a57;
      --warn: #982a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(50rem 20rem at -10% -10%, rgba(181,91,35,.2), transparent 60%),
        radial-gradient(60rem 26rem at 110% 110%, rgba(12,122,87,.2), transparent 60%),
        #edf3ed;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 38px rgba(0,0,0,.1);
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 30px;
    }
    .sub { margin-top: 6px; color: #4f645b; font-size: 13px; }
    .toolbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    button.ghost {
      color: var(--ink);
      background: rgba(255,255,255,.8);
      border: 1px solid var(--line);
    }
    .grid {
      margin-top: 14px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    .field label { font-size: 12px; display: block; margin-bottom: 4px; color: #4f635b; }
    .field input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 10px;
      font: inherit;
      background: #fff;
    }
    .full { grid-column: 1 / -1; }
    .status { margin-top: 10px; color: var(--warn); min-height: 18px; font-size: 12px; }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 12px;
    }
    .steps { display: grid; gap: 8px; margin-top: 8px; }
    .step {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      background: #fff;
    }
    .history-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      background: #fff;
      margin-top: 10px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-info {
      font-size: 12px;
      line-height: 1.4;
    }
    .status-succeeded {
      color: var(--accent);
      font-weight: 600;
    }
    .status-failed {
      color: var(--warn);
      font-weight: 600;
    }
    .status-running {
      color: #f59e0b;
      font-weight: 600;
    }
    .status-pending {
      color: #6b7280;
      font-weight: 600;
    }
    .history-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.8);
      color: var(--ink);
      font-size: 11px;
      cursor: pointer;
      font-weight: normal;
    }
    .action-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .action-btn.delete {
      border-color: var(--warn);
      color: var(--warn);
    }
    .action-btn.delete:hover {
      background: var(--warn);
      color: #fff;
    }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-dialog {
      background: #fff; border-radius: 16px; padding: 24px; max-width: 520px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal-dialog h3 { margin: 0 0 8px; font-family: "Noto Serif SC", serif; }
    .modal-dialog p { font-size: 13px; color: #6b7280; margin: 0 0 12px; }
    .key-url-box { background: #f3f4f6; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .key-url-box a { font-size: 12px; word-break: break-all; color: var(--accent); }
    .modal-dialog textarea {
      width: 100%; height: 80px; border-radius: 8px; border: 1px solid var(--line);
      padding: 10px; font: inherit; font-size: 12px; resize: vertical;
    }
    .modal-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .drop-zone {
      border: 2px dashed var(--line); border-radius: 10px; padding: 20px;
      text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 12px;
      transition: border-color .2s, background .2s; cursor: pointer;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: rgba(12,122,87,.06); }
    .drop-zone.loaded { border-color: var(--accent); border-style: solid; background: rgba(12,122,87,.04); }
    .drop-zone.loaded .drop-icon { color: var(--accent); }
    .key-hint { font-size: 12px; min-height: 18px; margin: -8px 0 8px; }
    .key-hint.ok { color: var(--accent); }
    .key-hint.err { color: var(--warn); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>PKU Video 工作台</h1>
    <div class="sub">在下方输入课程回放的下载链接和你的门户账密，让严小希来帮你上课记笔记！（IAAA账密用于教学网登陆鉴权，你的账密会被直接发送至北大IAAA验证服务器，我们不会储存您的账密）</div>

    <div class="toolbar">
      <button id="goAppBtn" class="ghost">返回聊天主页</button>
      <button id="submitBtn">提交处理任务</button>
      <button id="historyBtn">查看历史记录</button>
    </div>

    <section class="grid">
      <div class="field full">
        <label for="videoUrl">视频下载链接</label>
        <input id="videoUrl" placeholder="https://..." />
        <div style="font-size: 12px; margin-top: 4px; color: #6b7280;">如何获取课程回放下载链接？<a href="https://www.cxxdgc.cn/blog/project/videodownload2025autumn_addition" target="_blank" style="color: #0c7a57;">点此查看</a></div>
      </div>
      <div class="field">
        <label for="pkuAuthOne">IAAA账号</label>
        <input id="pkuAuthOne" placeholder="2x000xxxxx" />
      </div>
      <div class="field">
        <label for="pkuAuthTwo">IAAA密码</label>
        <input id="pkuAuthTwo" type="password" placeholder="xxxxx" />
      </div>
    </section>

    <div class="card" style="margin-top: 16px;">
      <strong>资源限额</strong>
      <div id="quotaInfo" class="mono">加载中...</div>
    </div>

    <div id="status" class="status"></div>

    <section class="card">
      <strong>任务状态</strong>
      <div class="mono" id="jobMeta">尚未提交任务</div>
      <div class="steps" id="steps"></div>
    </section>

    <section class="card" id="historySection" style="display: none;">
      <strong>历史任务记录</strong>
      <div id="historyList"></div>
    </section>
  <div class="modal-overlay" id="keyModal">
      <div class="modal-dialog">
        <h3>需要解密密钥</h3>
        <p>此视频为 m3u8 加密流，请点击下方链接在新页面中打开，或将下载的密钥文件拖入下方区域：</p>
        <div class="key-url-box">
          <a id="keyUrl" href="#" target="_blank"></a>
        </div>
        <div class="drop-zone" id="dropZone">
          <span id="dropHint">拖拽密钥文件到此处</span>
        </div>
        <textarea id="manualKey" placeholder="或在此粘贴密钥内容..." oninput="validateKey()"></textarea>
        <div id="keyHint" class="key-hint"></div>
        <div class="modal-actions">
          <button id="keyCancelBtn" class="ghost">取消</button>
          <button id="keyConfirmBtn">提交密钥</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const jobMetaEl = document.getElementById("jobMeta");
    const stepsEl = document.getElementById("steps");
    const quotaInfoEl = document.getElementById("quotaInfo");
    let activeJobId = "";
    let pollTimer = null;
    let storageQuota = 0;
    let processingQuota = 0;

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    function esc(s) {
      return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function renderJob(job) {
      jobMetaEl.textContent = "";
      if (job.status === "succeeded") {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em; color: #22c55e;">处理完成！</div>';
        if (job.pdf_path) {
          stepsEl.innerHTML += '<div class="step" style="margin-top: 16px;"><button onclick="downloadPdf(\'' + job.id + '\')" class="action-btn" style="background: var(--accent); color: #fff; padding: 12px 24px; font-size: 1.1em;">下载 PDF</button></div>';
        }
      } else if (job.status === "failed") {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em; color: #ef4444;">处理失败: ' + esc(job.error || "未知错误") + '</div>';
      } else {
        stepsEl.innerHTML = '<div class="step" style="font-size: 1.2em;">正在执行中，请稍后...</div>';
      }
    }

    async function checkLogin() {
      try {
        const userInfo = await api("/api/auth/me");
        storageQuota = userInfo.storage_quota || 0;
        processingQuota = userInfo.processing_quota || 0;
        updateQuotaDisplay();
      } catch {
        location.href = "/auth?next=/pkuvideo";
      }
    }

    async function updateQuotaDisplay() {
      try {
        const userInfo = await api("/api/auth/me");
        storageQuota = userInfo.storage_quota || 0;
        processingQuota = userInfo.processing_quota || 0;
        quotaInfoEl.innerHTML = `储存资源限额: 3 | 剩余: ${storageQuota}<br/>处理资源限额: 1 | 剩余: ${processingQuota}`;
      } catch (err) {
        quotaInfoEl.textContent = `获取限额信息失败: ${err.message}`;
      }
    }

    async function submitJob(manualKey) {
      if (processingQuota <= 0) {
        statusEl.textContent = "提交失败: 处理资源限额不足，请联系管理员获取更多额度（严小希平均处理1小时的回放需要消耗价值0.5r的token，严小希并没有那么充足的应对攻击的资金qwq，设置限额是为了保障正常使用）";
        return;
      }

      statusEl.textContent = "提交中...";
      const body = {
        video_url: document.getElementById("videoUrl").value.trim(),
        pku_auth_one: document.getElementById("pkuAuthOne").value.trim(),
        pku_auth_two: document.getElementById("pkuAuthTwo").value.trim()
      };
      if (manualKey) body.manual_key = manualKey;

      api("/api/pkuvideo/submit-web", "POST", body)
        .then(resp => {
          activeJobId = resp.job_id;
          statusEl.textContent = "提交成功，任务已入队。";
          processingQuota -= 1;
          quotaInfoEl.innerHTML = `储存资源限额: 3 | 剩余: ${storageQuota}<br/>处理资源限额: 1 | 剩余: ${processingQuota}`;
          startPolling();
        })
        .catch(err => {
          statusEl.textContent = "提交失败: " + err.message;
          updateQuotaDisplay();
        });
    }

    async function checkM3u8AndSubmit() {
      const url = document.getElementById("videoUrl").value.trim();
      if (!url.includes(".m3u8")) return submitJob();

      statusEl.textContent = "正在检测视频加密信息...";
      try {
        const resp = await api("/api/pkuvideo/check-m3u8", "POST", {
          video_url: url,
          pku_auth_one: document.getElementById("pkuAuthOne").value.trim(),
          pku_auth_two: document.getElementById("pkuAuthTwo").value.trim()
        });
        if (resp.is_m3u8 && resp.key_uri) {
          document.getElementById("keyUrl").href = resp.key_uri;
          document.getElementById("keyUrl").textContent = resp.key_uri;
          document.getElementById("manualKey").value = "";
          document.getElementById("keyModal").style.display = "flex";
        } else {
          submitJob();
        }
      } catch (err) {
        statusEl.textContent = "检测失败: " + err.message;
      }
    }

    document.getElementById("keyConfirmBtn").addEventListener("click", () => {
      const hint = document.getElementById("keyHint");
      const key = document.getElementById("manualKey").value.trim();
      if (!key) { hint.textContent = "请粘贴密钥内容或拖入文件"; hint.className = "key-hint err"; return; }
      if (new TextEncoder().encode(key).length > 20) {
        hint.textContent = "密钥过长（超过20字节）"; hint.className = "key-hint err";
        return;
      }
      document.getElementById("keyModal").style.display = "none";
      submitJob(key);
    });

    document.getElementById("keyCancelBtn").addEventListener("click", () => {
      document.getElementById("keyModal").style.display = "none";
      statusEl.textContent = "已取消";
    });

    function validateKey() {
      const key = document.getElementById("manualKey").value.trim();
      const hint = document.getElementById("keyHint");
      if (!key) { hint.textContent = ""; hint.className = "key-hint"; return; }
      const size = new TextEncoder().encode(key).length;
      if (size > 20) {
        hint.textContent = `密钥过长（${size} 字节，超过20字节上限）`;
        hint.className = "key-hint err";
      } else {
        hint.textContent = `密钥长度 ${size} 字节，格式正确`;
        hint.className = "key-hint ok";
      }
    }

    // --- 拖拽上传 ---
    const dropZone = document.getElementById("dropZone");
    const dropHint = document.getElementById("dropHint");
    const textarea = document.getElementById("manualKey");

    function handleDropFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result.trim();
        textarea.value = text;
        validateKey();
        dropHint.textContent = file.name;
        dropZone.classList.add("loaded");
      };
      reader.readAsText(file);
    }

    ['dragenter','dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    });
    ['dragleave','drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("drag-over"); });
    });
    dropZone.addEventListener("drop", e => {
      if (e.dataTransfer.files.length) handleDropFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.onchange = () => { if (input.files.length) handleDropFile(input.files[0]); };
      input.click();
    });

    async function pollJob() {
      if (!activeJobId) return;
      try {
        const job = await api("/api/pkuvideo/jobs/" + activeJobId);
        renderJob(job);
        if (job.status === "succeeded" || job.status === "failed") {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch (err) {
        statusEl.textContent = "查询任务失败: " + err.message;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollJob();
      pollTimer = setInterval(pollJob, 2000);
    }

    async function loadHistory() {
      try {
        const jobs = await api("/api/pkuvideo/jobs");
        const historyList = document.getElementById("historyList");
        
        if (jobs.length === 0) {
          historyList.innerHTML = "暂无历史任务记录";
        } else {
          historyList.innerHTML = jobs.map(job => {
            const statusText = job.status === "succeeded" ? "已完成" : (job.status === "failed" ? "失败" : "处理中");
            const statusColor = job.status === "succeeded" ? "#22c55e" : (job.status === "failed" ? "#ef4444" : "#eab308");
            return `
              <div class="history-item">
                <div class="history-header">
                  <span>创建时间: ${job.created_at}</span>
                  <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
                </div>
                <div class="history-info">
                  <div>视频链接: ${esc(job.video_url)}</div>
                  <div class="history-actions">
                    ${job.pdf_path ? `<button onclick="downloadPdf('${job.id}')" class="action-btn" style="background: var(--accent); color: #fff;">下载 PDF</button>` : ""}
                    <button onclick="deleteJob('${job.id}')" class="action-btn delete">删除任务</button>
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }
        
        document.getElementById("historySection").style.display = "block";
      } catch (err) {
        statusEl.textContent = "加载历史记录失败: " + err.message;
      }
    }

    async function deleteJob(jobId) {
      if (!confirm("确定要删除此任务吗？删除后将无法恢复，相关文件也会被删除。")) {
        return;
      }

      try {
        statusEl.textContent = "正在删除任务...";
        await api("/api/pkuvideo/jobs/" + jobId, "DELETE");
        statusEl.textContent = "任务删除成功";
        // 刷新限额信息和历史记录
        await updateQuotaDisplay();
        await loadHistory();
      } catch (err) {
        statusEl.textContent = "删除任务失败: " + err.message;
      }
    }

    async function downloadPdf(jobId) {
      try {
        const response = await fetch(`/api/pkuvideo/jobs/${jobId}/pdf`, {
          method: "GET",
          credentials: "include"
        });
        if (!response.ok) {
          throw new Error("下载失败");
        }
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `lecture_notes_${jobId}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("下载 PDF 失败: " + err.message);
      }
    }

    async function reexecuteStep(jobId, stepIndex) {
      try {
        statusEl.textContent = "正在重新执行步骤...";
        const stepNames = ["download_video", "extract_mp3", "speech_to_text", "extract_notes", "compile_pdf"];
        const stepName = stepNames[stepIndex];
        
        await api(`/api/pkuvideo/jobs/${jobId}/reexecute`, "POST", {
          step: stepIndex
        });
        
        statusEl.textContent = `步骤 ${stepIndex} (${stepName}) 重新执行成功`;
        // 重新加载历史记录以更新状态
        await loadHistory();
      } catch (err) {
        statusEl.textContent = "重新执行步骤失败: " + err.message;
      }
    }

    document.getElementById("goAppBtn").addEventListener("click", () => {
      location.href = "/app";
    });
    document.getElementById("submitBtn").addEventListener("click", checkM3u8AndSubmit);
    document.getElementById("historyBtn").addEventListener("click", loadHistory);

    checkLogin();
  </script>
</body>
</html>
