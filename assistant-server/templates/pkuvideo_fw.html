<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>「严小希」小助手-视频下载</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13241d;
      --line: rgba(19,36,29,.18);
      --accent: #0c7a57;
      --warn: #982a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(50rem 20rem at -10% -10%, rgba(181,91,35,.2), transparent 60%),
        radial-gradient(60rem 26rem at 110% 110%, rgba(12,122,87,.2), transparent 60%),
        #edf3ed;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 38px rgba(0,0,0,.1);
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 30px;
    }
    .sub { margin-top: 6px; color: #4f645b; font-size: 13px; }
    .toolbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    button.ghost {
      color: var(--ink);
      background: rgba(255,255,255,.8);
      border: 1px solid var(--line);
    }
    .grid {
      margin-top: 14px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    .field label { font-size: 12px; display: block; margin-bottom: 4px; color: #4f635b; }
    .field input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 10px;
      font: inherit;
      background: #fff;
    }
    .full { grid-column: 1 / -1; }
    .status { margin-top: 10px; color: var(--warn); min-height: 18px; font-size: 12px; }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 12px;
    }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-dialog {
      background: #fff; border-radius: 16px; padding: 24px; max-width: 520px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal-dialog h3 { margin: 0 0 8px; font-family: "Noto Serif SC", serif; }
    .modal-dialog p { font-size: 13px; color: #6b7280; margin: 0 0 12px; }
    .key-url-box { background: #f3f4f6; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .key-url-box a { font-size: 12px; word-break: break-all; color: var(--accent); }
    .modal-dialog textarea {
      width: 100%; height: 80px; border-radius: 8px; border: 1px solid var(--line);
      padding: 10px; font: inherit; font-size: 12px; resize: vertical;
    }
    .modal-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .drop-zone {
      border: 2px dashed var(--line); border-radius: 10px; padding: 20px;
      text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 12px;
      transition: border-color .2s, background .2s; cursor: pointer;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: rgba(12,122,87,.06); }
    .drop-zone.loaded { border-color: var(--accent); border-style: solid; background: rgba(12,122,87,.04); }
    .drop-zone.loaded .drop-icon { color: var(--accent); }
    .key-hint { font-size: 12px; min-height: 18px; margin: -8px 0 8px; }
    .key-hint.ok { color: var(--accent); }
    .key-hint.err { color: var(--warn); }
    .job-result {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 12px;
    }
    .result-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.8);
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .action-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .action-btn.delete {
      border-color: var(--warn);
      color: var(--warn);
    }
    .action-btn.delete:hover {
      background: var(--warn);
      color: #fff;
    }
    video {
      width: 100%;
      max-height: 480px;
      border-radius: 10px;
      background: #000;
    }
    .progress-wrap {
      margin-top: 12px;
      background: #e5e7eb;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0c7a57, #22c55e);
      border-radius: 8px;
      transition: width .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      min-width: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>PKU Video 视频下载</h1>
    <div class="sub">输入课程回放的下载链接和你的门户账密，下载视频后可直接在线预览。每个用户同时只能处理一个视频。（IAAA账密用于教学网登陆鉴权，你的账密会被直接发送至北大IAAA验证服务器，我们不会储存您的账密）</div>

    <div class="toolbar">
      <button id="goAppBtn" class="ghost">返回聊天主页</button>
      <button id="submitBtn">提交下载任务</button>
    </div>

    <section class="grid" id="inputSection">
      <div class="field full">
        <label for="videoUrl">视频下载链接</label>
        <input id="videoUrl" placeholder="https://..." />
        <div style="font-size: 12px; margin-top: 4px; color: #6b7280;">如何获取课程回放下载链接？<a href="https://www.cxxdgc.cn/blog/project/videodownload2025autumn_addition" target="_blank" style="color: #0c7a57;">点此查看</a></div>
      </div>
      <div class="field">
        <label for="pkuAuthOne">IAAA账号</label>
        <input id="pkuAuthOne" placeholder="2x000xxxxx" />
      </div>
      <div class="field">
        <label for="pkuAuthTwo">IAAA密码</label>
        <input id="pkuAuthTwo" type="password" placeholder="xxxxx" />
      </div>
    </section>

    <div id="status" class="status"></div>

    <section class="job-result" id="jobResult" style="display: none;">
      <strong>任务状态</strong>
      <div class="mono" id="jobMeta">加载中...</div>
      <div class="progress-wrap" id="progressWrap" style="display: none;">
        <div class="progress-bar" id="progressBar" style="width: 0%;">0%</div>
      </div>
      <div id="videoPreview" style="display: none; margin-top: 12px;"></div>
      <div class="result-actions" id="resultActions"></div>
    </section>

    <div class="modal-overlay" id="keyModal">
      <div class="modal-dialog">
        <h3>需要解密密钥</h3>
        <p>此视频为 m3u8 加密流，请点击下方链接在新页面中打开，或将下载的密钥文件拖入下方区域：</p>
        <div class="key-url-box">
          <a id="keyUrl" href="#" target="_blank"></a>
        </div>
        <div class="drop-zone" id="dropZone">
          <span id="dropHint">拖拽密钥文件到此处</span>
        </div>
        <textarea id="manualKey" placeholder="或在此粘贴密钥内容..." oninput="validateKey()"></textarea>
        <div id="keyHint" class="key-hint"></div>
        <div class="modal-actions">
          <button id="keyCancelBtn" class="ghost">取消</button>
          <button id="keyConfirmBtn">提交密钥</button>
        </div>
      </div>
    </div>
  </main>

  <dialog id="restartTranslationDialog" style="border:0;border-radius:12px;max-width:420px;width:85%">
    <form onsubmit="event.preventDefault(); submitRestartTranslation();">
      <h3>重新翻译：管理员验证</h3>
      <p>旧翻译视频、字幕与处理缓存将被清除，原视频保留。</p>
      <label for="restartAdminPassword">管理员密码</label>
      <input id="restartAdminPassword" type="password" autocomplete="off" required style="width:100%;box-sizing:border-box;margin-top:8px" />
      <p id="restartTranslationError" role="alert" style="color:#c33"></p>
      <div class="modal-actions">
        <button type="button" class="ghost" onclick="closeRestartTranslation()">取消</button>
        <button id="restartTranslationSubmit" type="submit">验证并重新翻译</button>
      </div>
    </form>
  </dialog>
  <script>
    const statusEl = document.getElementById("status");
    const jobMetaEl = document.getElementById("jobMeta");
    const jobResultEl = document.getElementById("jobResult");
    const inputSection = document.getElementById("inputSection");
    const submitBtn = document.getElementById("submitBtn");
    const videoPreview = document.getElementById("videoPreview");
    const resultActions = document.getElementById("resultActions");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    let activeJobId = "";
    let pollTimer = null;
    let pollInFlight = false;
    let translationTimer = null;
    let translationInFlight = false;
    let translationReady = false;
    let deletingVideo = false;
    let sourceSwitch = 0;
    let restartJobId = '';
    let restartInFlight = false;
    let translationEpoch = 0;
    document.getElementById('restartTranslationDialog').addEventListener('cancel', event => {
      event.preventDefault();
      closeRestartTranslation();
    });

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        credentials: "include",
        cache: "no-store",
        signal: method === "GET" ? AbortSignal.timeout(15000) : undefined,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    function esc(s) {
      return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function renderJob(job) {
      if (job.status === "succeeded") {
        jobMetaEl.textContent = "下载完成！";
        progressWrap.style.display = "none";
        jobResultEl.style.display = "block";
        inputSection.style.display = "none";
        submitBtn.style.display = "none";

        // 视频预览
        const videoUrl = `/api/pkuvideo_fw/jobs/${job.id}/video.mp4`;
        videoPreview.style.display = "block";
        if (videoPreview.dataset.jobId !== job.id) {
          videoPreview.dataset.jobId = job.id;
          translationReady = false;
          videoPreview.innerHTML = `
          <video id="fwPlayer" controls data-variant="source">
            <source src="${videoUrl}" type="video/mp4">
            您的浏览器不支持 video 标签
          </video>
          <div id="translationStatus" role="status" aria-live="polite" style="margin-top:8px"></div>
          <div id="translationControls" hidden style="margin-top:8px">
            <label>音频 <select id="audioVersion" onchange="switchAudio(this.value)"><option value="dub">中文配音</option><option value="source">原声</option></select></label>
            <label style="margin-left:12px">字幕 <select id="subtitleVersion" onchange="updateSubtitleTracks()"><option value="zh">中文</option><option value="bilingual">中英双语</option><option value="en">英文</option><option value="off">关闭</option></select></label>
            <span id="subtitlePrecision" style="font-size:12px;color:#6b7280">字幕按实际配音块同步</span>
          </div>
        `;

        resultActions.innerHTML = `
          <button id="translateBtn" class="action-btn" onclick="startTranslation(false)" style="background: var(--accent); color: #fff;">视频翻译</button>
          <button id="restartTranslationBtn" class="action-btn" onclick="confirmRestartTranslation()" hidden disabled>重新翻译</button>
          <button class="action-btn" onclick="downloadVideo('${job.id}')">下载原视频</button>
          <button id="downloadTranslatedBtn" class="action-btn" onclick="downloadTranslatedVideo()" hidden disabled>下载翻译视频</button>
          <button class="action-btn delete" onclick="deleteJob('${job.id}')">删除任务</button>
        `;
          refreshTranslation();
        }
      } else if (job.status === "failed") {
        jobMetaEl.textContent = "下载失败: " + esc(job.error || "未知错误");
        progressWrap.style.display = "none";
        jobResultEl.style.display = "block";
        videoPreview.style.display = "none";
        resultActions.innerHTML = `
          <button class="action-btn delete" onclick="deleteJob('${job.id}')">删除任务</button>
        `;
      } else if (job.status === "running" || job.status === "pending") {
        const pct = job.progress != null ? job.progress : 0;
        jobMetaEl.textContent = job.merging ? "分片下载完成，正在合并视频（99%）…" : "正在下载中，请稍后...";
        progressWrap.style.display = "block";
        progressBar.style.width = pct + "%";
        progressBar.textContent = pct + "%";
        progressBar.setAttribute('aria-valuenow', pct);
        jobResultEl.style.display = "block";
        inputSection.style.display = "none";
        submitBtn.style.display = "none";
        videoPreview.style.display = "none";
        resultActions.innerHTML = "";
      }
    }

    async function checkLogin() {
      try {
        await api("/api/auth/me");
      } catch {
        location.href = "/auth?next=/pkuvideo_fw";
      }
    }

    async function checkExistingJob() {
      try {
        const jobs = await api("/api/pkuvideo_fw/jobs");
        if (jobs.length > 0) {
          const job = jobs[0];
          activeJobId = job.id;
          renderJob(job);
          if (job.status === "running" || job.status === "pending") {
            startPolling();
          }
        } else {
          // 没有任务，显示输入表单
          inputSection.style.display = "";
          submitBtn.style.display = "";
          jobResultEl.style.display = "none";
        }
      } catch (err) {
        statusEl.textContent = "加载任务状态失败: " + err.message;
      }
    }

    async function submitJob(manualKey) {
      statusEl.textContent = "提交中...";
      const body = {
        video_url: document.getElementById("videoUrl").value.trim(),
        pku_auth_one: document.getElementById("pkuAuthOne").value.trim(),
        pku_auth_two: document.getElementById("pkuAuthTwo").value.trim()
      };
      if (manualKey) body.manual_key = manualKey;

      api("/api/pkuvideo_fw/submit", "POST", body)
        .then(resp => {
          activeJobId = resp.job_id;
          statusEl.textContent = "提交成功，任务已入队。";
          inputSection.style.display = "none";
          submitBtn.style.display = "none";
          jobResultEl.style.display = "block";
          jobMetaEl.textContent = "正在下载中，请稍后...";
          startPolling();
        })
        .catch(err => {
          statusEl.textContent = "提交失败: " + err.message;
        });
    }

    async function checkM3u8AndSubmit() {
      const url = document.getElementById("videoUrl").value.trim();
      if (!url.includes(".m3u8")) return submitJob();

      statusEl.textContent = "正在检测视频加密信息...";
      try {
        const resp = await api("/api/pkuvideo_fw/check-m3u8", "POST", {
          video_url: url,
          pku_auth_one: document.getElementById("pkuAuthOne").value.trim(),
          pku_auth_two: document.getElementById("pkuAuthTwo").value.trim()
        });
        if (resp.is_m3u8 && resp.key_uri) {
          document.getElementById("keyUrl").href = resp.key_uri;
          document.getElementById("keyUrl").textContent = resp.key_uri;
          document.getElementById("manualKey").value = "";
          document.getElementById("keyModal").style.display = "flex";
        } else {
          submitJob();
        }
      } catch (err) {
        statusEl.textContent = "检测失败: " + err.message;
      }
    }

    document.getElementById("keyConfirmBtn").addEventListener("click", () => {
      const hint = document.getElementById("keyHint");
      const key = document.getElementById("manualKey").value.trim();
      if (!key) { hint.textContent = "请粘贴密钥内容或拖入文件"; hint.className = "key-hint err"; return; }
      if (new TextEncoder().encode(key).length > 20) {
        hint.textContent = "密钥过长（超过20字节）"; hint.className = "key-hint err";
        return;
      }
      document.getElementById("keyModal").style.display = "none";
      submitJob(key);
    });

    document.getElementById("keyCancelBtn").addEventListener("click", () => {
      document.getElementById("keyModal").style.display = "none";
      statusEl.textContent = "已取消";
    });

    function validateKey() {
      const key = document.getElementById("manualKey").value.trim();
      const hint = document.getElementById("keyHint");
      if (!key) { hint.textContent = ""; hint.className = "key-hint"; return; }
      const size = new TextEncoder().encode(key).length;
      if (size > 20) {
        hint.textContent = `密钥过长（${size} 字节，超过20字节上限）`;
        hint.className = "key-hint err";
      } else {
        hint.textContent = `密钥长度 ${size} 字节，格式正确`;
        hint.className = "key-hint ok";
      }
    }

    // --- 拖拽上传 ---
    const dropZone = document.getElementById("dropZone");
    const dropHint = document.getElementById("dropHint");
    const textarea = document.getElementById("manualKey");

    function handleDropFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result.trim();
        textarea.value = text;
        validateKey();
        dropHint.textContent = file.name;
        dropZone.classList.add("loaded");
      };
      reader.readAsText(file);
    }

    ['dragenter','dragover'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    });
    ['dragleave','drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("drag-over"); });
    });
    dropZone.addEventListener("drop", e => {
      if (e.dataTransfer.files.length) handleDropFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.onchange = () => { if (input.files.length) handleDropFile(input.files[0]); };
      input.click();
    });

    async function pollJob() {
      if (!activeJobId || pollInFlight) return;
      const jobId = activeJobId;
      pollInFlight = true;
      try {
        const job = await api("/api/pkuvideo_fw/jobs/" + jobId);
        if (jobId !== activeJobId) return;
        renderJob(job);
        if (job.status === "succeeded" || job.status === "failed") {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch (err) {
        statusEl.textContent = "查询任务失败: " + err.message;
      } finally {
        pollInFlight = false;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollJob();
      pollTimer = setInterval(pollJob, 1000);
    }

    async function deleteJob(jobId) {
      if (!confirm("确定要删除此任务吗？原视频、翻译视频、字幕和全部处理缓存都会被删除，正在执行的翻译也会停止。")) {
        return;
      }

      try {
        deletingVideo = true;
        clearInterval(translationTimer);
        translationTimer = null;
        const player = document.getElementById('fwPlayer');
        if (player) { player.pause(); player.removeAttribute('src'); player.querySelectorAll('source,track').forEach(el => el.remove()); player.load(); }
        statusEl.textContent = "正在删除任务...";
        await api("/api/pkuvideo_fw/jobs/" + jobId, "DELETE");
        statusEl.textContent = "任务删除成功";
        activeJobId = "";
        // 重新显示输入表单
        inputSection.style.display = "";
        submitBtn.style.display = "";
        jobResultEl.style.display = "none";
        videoPreview.style.display = "none";
        videoPreview.innerHTML = "";
        delete videoPreview.dataset.jobId;
        translationReady = false;
        resultActions.innerHTML = "";
      } catch (err) {
        statusEl.textContent = "删除任务失败: " + err.message;
      } finally {
        deletingVideo = false;
      }
    }

    async function refreshTranslation() {
      if (!activeJobId || translationInFlight || deletingVideo) return;
      const id = activeJobId;
      const epoch = translationEpoch;
      translationInFlight = true;
      try {
        const response = await api(`/api/pkuvideo_fw/jobs/${id}/translation`);
        if (id !== activeJobId || deletingVideo || epoch !== translationEpoch) return;
        renderTranslation(response.translation, response.enabled);
      } catch (error) {
        const label = document.getElementById('translationStatus');
        if (label && id === activeJobId && !deletingVideo) label.textContent = '查询翻译状态失败：' + error.message;
        // A temporary network error must not leave a running task unobserved.
        if (id === activeJobId && !deletingVideo && !translationTimer) translationTimer = setInterval(refreshTranslation, 3000);
      } finally { translationInFlight = false; }
    }

    function renderTranslation(job, enabled = true) {
      const button = document.getElementById('translateBtn');
      const label = document.getElementById('translationStatus');
      if (!button || !label) return;
      const busy = job && ['queued', 'running', 'deleting'].includes(job.status);
      const failed = job && job.status === 'failed';
      const ready = job && job.status === 'succeeded';
      const restartButton = document.getElementById('restartTranslationBtn');
      restartButton.hidden = !(ready || failed);
      restartButton.disabled = !enabled || busy || restartInFlight;
      button.disabled = !enabled || busy || ready;
      button.textContent = !enabled ? '视频翻译未开启' : busy ? (job.status === 'deleting' ? '正在清理' : '正在翻译…') : ready ? '翻译完成' : failed ? '重试翻译' : '视频翻译';
      button.onclick = () => startTranslation(!!failed);
      label.textContent = job ? (job.error ? `${job.stage}：${job.error}` : job.stage + (job.total_blocks && !String(job.stage).includes('已完成') ? `（${job.completed_blocks}/${job.total_blocks} 块）` : '')) : '';
      document.getElementById('downloadTranslatedBtn').disabled = !ready;
      document.getElementById('downloadTranslatedBtn').hidden = !ready;
      document.getElementById('translationControls').hidden = !ready;
      document.getElementById('subtitlePrecision').textContent = job && job.subtitle_precision === 'asr' ? '中文字幕已校准' : job && job.subtitle_precision === 'mixed' ? '中文字幕已校准，部分片段使用块级同步' : '字幕按实际配音块同步';
      if (ready && !translationReady) {
        translationReady = true;
        switchAudio('dub');
      }
      if (busy && !translationTimer) translationTimer = setInterval(refreshTranslation, 3000);
      if (!busy) { clearInterval(translationTimer); translationTimer = null; }
    }

    function confirmRestartTranslation() {
      if (!activeJobId || deletingVideo || restartInFlight) return;
      if (!confirm('确定要重新翻译吗？旧翻译视频、字幕和全部翻译缓存将被清除，并从头重新调用识别、翻译和配音服务。原视频保留。')) return;
      restartJobId = activeJobId;
      document.getElementById('restartAdminPassword').value = '';
      document.getElementById('restartTranslationError').textContent = '';
      document.getElementById('restartTranslationDialog').showModal();
      document.getElementById('restartAdminPassword').focus();
    }

    function closeRestartTranslation() {
      if (restartInFlight) return;
      document.getElementById('restartTranslationDialog').close();
      document.getElementById('restartAdminPassword').value = '';
      restartJobId = '';
    }

    async function submitRestartTranslation() {
      if (!restartJobId || restartJobId !== activeJobId || deletingVideo || restartInFlight) return;
      const id = restartJobId;
      const input = document.getElementById('restartAdminPassword');
      if (!input.value) return;
      restartInFlight = true;
      translationEpoch++;
      document.getElementById('restartTranslationSubmit').disabled = true;
      try {
        const request = api(`/api/pkuvideo_fw/jobs/${id}/translation/restart`, 'POST', { admin_password: input.value });
        input.value = '';
        const response = await request;
        translationEpoch++;
        if (id === activeJobId && !deletingVideo) {
          // Switch away from the old output before the rebuilt file becomes available.
          if (translationReady) switchAudio('source');
          translationReady = false;
          document.getElementById('fwPlayer')?.querySelectorAll('track').forEach(el => el.remove());
          renderTranslation(response.translation);
        }
        restartInFlight = false;
        closeRestartTranslation();
      } catch (error) {
        document.getElementById('restartTranslationError').textContent = '重新翻译失败：' + error.message;
      } finally {
        restartInFlight = false;
        document.getElementById('restartTranslationSubmit').disabled = false;
      }
    }

    async function startTranslation(retry) {
      if (!activeJobId || deletingVideo) return;
      const id = activeJobId;
      const button = document.getElementById('translateBtn');
      button.disabled = true;
      try {
        const response = await api(`/api/pkuvideo_fw/jobs/${id}/translation${retry ? '/retry' : ''}`, 'POST', {});
        if (id === activeJobId && !deletingVideo) renderTranslation(response.translation);
      } catch (error) {
        if (id === activeJobId && !deletingVideo) {
          document.getElementById('translationStatus').textContent = '翻译提交失败：' + error.message;
          button.disabled = false;
        }
      }
    }

    function switchAudio(version) {
      const player = document.getElementById('fwPlayer');
      if (!player || !translationReady || deletingVideo) return;
      document.getElementById('audioVersion').value = version;
      if (player.dataset.variant === version) { updateSubtitleTracks(); return; }
      const saved = { time: player.currentTime || 0, paused: player.paused, rate: player.playbackRate, volume: player.volume, muted: player.muted };
      const generation = ++sourceSwitch;
      const id = activeJobId;
      player.pause();
      player.dataset.variant = version;
      player.querySelectorAll('source,track').forEach(el => el.remove());
      player.src = `/api/pkuvideo_fw/jobs/${id}/${version === 'dub' ? 'translation/' : ''}video.mp4`;
      player.addEventListener('loadedmetadata', () => {
        if (generation !== sourceSwitch || id !== activeJobId || deletingVideo) return;
        player.currentTime = Math.min(saved.time, Math.max(0, player.duration - 0.05));
        player.playbackRate = saved.rate; player.volume = saved.volume; player.muted = saved.muted;
        updateSubtitleTracks();
        if (!saved.paused) player.play().catch(() => {});
      }, { once: true });
      player.load();
    }

    function updateSubtitleTracks() {
      const player = document.getElementById('fwPlayer');
      if (!player || !translationReady) return;
      player.querySelectorAll('track').forEach(el => el.remove());
      const selection = document.getElementById('subtitleVersion').value;
      if (selection === 'off') return;
      const suffix = player.dataset.variant === 'dub' ? 'dub' : 'source';
      const kind = `${selection}.${suffix}`;
      const track = document.createElement('track');
      track.kind = 'subtitles'; track.label = selection === 'en' ? '英文' : selection === 'zh' ? '中文' : '中英双语';
      track.srclang = selection === 'en' ? 'en' : 'zh'; track.default = true;
      track.src = `/api/pkuvideo_fw/jobs/${activeJobId}/translation/subtitles/${kind}.vtt`;
      track.addEventListener('load', () => { track.track.mode = 'showing'; });
      player.appendChild(track); track.track.mode = 'showing';
    }

    function downloadTranslatedVideo() {
      if (!activeJobId || !translationReady) return;
      const a = document.createElement('a');
      a.href = `/api/pkuvideo_fw/jobs/${activeJobId}/translation/video.mp4?download=1`;
      a.download = `translated_${activeJobId}.mp4`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    async function downloadVideo(jobId) {
      const a = document.createElement("a");
      a.href = `/api/pkuvideo_fw/jobs/${jobId}/video.mp4?download=1`;
      a.download = `video_${jobId}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    document.getElementById("goAppBtn").addEventListener("click", () => {
      location.href = "/app";
    });
    document.getElementById("submitBtn").addEventListener("click", checkM3u8AndSubmit);

    async function openManualReplay() {
      const query = new URLSearchParams(location.search);
      const courseId = query.get('course_id'), lessonId = query.get('lesson_id');
      if (!courseId || !lessonId) return checkExistingJob();
      inputSection.style.display = 'none';
      submitBtn.style.display = 'none';
      statusEl.textContent = '正在准备好学回放，清理旧视频并获取最新地址，请稍候…';
      history.replaceState(null, '', '/pkuvideo_fw');
      try {
        const result = await api('/api/pkuvideo_fw/manual-replay','POST',{course_id:courseId,lesson_id:lessonId});
        activeJobId = result.job_id;
        statusEl.textContent = '正在通过好学 App 拉取回放，下载完成后可观看。';
        startPolling();
      } catch (error) {
        await checkExistingJob();
        statusEl.textContent = '准备回放失败：' + error.message;
      }
    }
    checkLogin().then(() => openManualReplay());
  </script>
</body>
</html>
