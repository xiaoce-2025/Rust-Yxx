<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>「严小希」小助手-课程回放批量处理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13241d;
      --line: rgba(19,36,29,.18);
      --accent: #0c7a57;
      --warn: #982a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(50rem 20rem at -10% -10%, rgba(181,91,35,.2), transparent 60%),
        radial-gradient(60rem 26rem at 110% 110%, rgba(12,122,87,.2), transparent 60%),
        #edf3ed;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 38px rgba(0,0,0,.1);
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 30px;
    }
    .sub { margin-top: 6px; color: #4f645b; font-size: 13px; }
    .toolbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    button.ghost {
      color: var(--ink);
      background: rgba(255,255,255,.8);
      border: 1px solid var(--line);
    }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 16px;
    }
    .course-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .course-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }
    .course-item:hover {
      border-color: var(--accent);
      background: rgba(12,122,87,.05);
    }
    .course-item.selected {
      border-color: var(--accent);
      background: rgba(12,122,87,.1);
    }
    .course-title {
      font-weight: 600;
      font-size: 14px;
    }
    .course-info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .status { margin-top: 10px; min-height: 18px; font-size: 12px; }
    .status.error { color: var(--warn); }
    .status.success { color: var(--accent); }
    .status.loading { color: #f59e0b; }
    .loading-spinner {
      border: 3px solid rgba(12,122,87,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .video-list {
      margin-top: 12px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
    }
    .video-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: #fff;
    }
    .video-item:last-child {
      margin-bottom: 0;
    }
    .video-checkbox {
      margin-right: 10px;
    }
    .video-title {
      flex: 1;
      font-size: 13px;
    }
    .video-duration {
      font-size: 12px;
      color: #6b7280;
    }
    .select-all-container {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .select-all-checkbox {
      margin-right: 8px;
    }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>课程回放批量处理</h1>
    <div class="sub">自动获取北大教学网课程列表，批量处理课程的全部回放视频。</div>

    <div class="toolbar">
      <button id="goAppBtn" class="ghost">返回聊天主页</button>
      <button id="refreshBtn" class="ghost">刷新课程列表</button>
      <button id="submitBtn" disabled>提交批量任务</button>
    </div>

    <div id="status" class="status"></div>

    <div class="card">
      <strong>选择课程</strong>
      <div id="courseList" class="course-list">
        <div class="status loading">
          <span class="loading-spinner"></span>正在加载课程列表...
        </div>
      </div>
    </div>

    <div class="card" id="videoSection" style="display: none;">
      <strong>选择视频</strong>
      <div class="select-all-container">
        <input type="checkbox" id="selectAll" class="select-all-checkbox" />
        <label for="selectAll">全选</label>
      </div>
      <div id="videoList" class="video-list"></div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const courseListEl = document.getElementById("courseList");
    const videoSectionEl = document.getElementById("videoSection");
    const videoListEl = document.getElementById("videoList");
    const selectAllEl = document.getElementById("selectAll");
    const submitBtnEl = document.getElementById("submitBtn");
    const refreshBtnEl = document.getElementById("refreshBtn");

    let selectedCourse = null;
    let selectedVideos = new Set();

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    async function checkLogin() {
      try {
        await api("/api/auth/me");
      } catch {
        location.href = "/auth?next=/pkuvideo_sequence";
      }
    }

    async function checkBinding() {
      try {
        const resp = await api("/api/pkuvideofullclass/binding-status");
        if (!resp.is_bound) {
          location.href = "/pkuvideofullclass?callback=/pkuvideo_sequence";
        }
      } catch (err) {
        statusEl.textContent = "检测绑定状态失败: " + err.message;
        statusEl.className = "status error";
      }
    }

    async function loadCourseList() {
      courseListEl.innerHTML = '<div class="status loading"><span class="loading-spinner"></span>正在加载课程列表...</div>';
      statusEl.textContent = "";

      try {
        const resp = await api("/api/pkuvideofullclass/courses");
        if (resp.success && resp.courses && resp.courses.length > 0) {
          courseListEl.innerHTML = resp.courses.map(course => `
            <div class="course-item" data-course-id="${course.id}">
              <div class="course-title">${esc(course.name)}</div>
              <div class="course-info">学期: ${course.term} | 教师: ${course.teacher || "未知"} | 视频数: ${course.video_count || 0}</div>
            </div>
          `).join("");

          document.querySelectorAll(".course-item").forEach(item => {
            item.addEventListener("click", handleCourseSelect);
          });
        } else {
          courseListEl.innerHTML = '<div class="status">未找到课程，请确认已正确绑定IAAA账号</div>';
        }
      } catch (err) {
        courseListEl.innerHTML = '';
        statusEl.textContent = "加载课程列表失败: " + err.message;
        statusEl.className = "status error";
      }
    }

    function esc(s) {
      return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    async function handleCourseSelect(e) {
      const courseItem = e.currentTarget;
      const courseId = courseItem.dataset.courseId;

      document.querySelectorAll(".course-item").forEach(item => item.classList.remove("selected"));
      courseItem.classList.add("selected");
      selectedCourse = courseId;

      videoSectionEl.style.display = "none";
      videoListEl.innerHTML = '';
      selectedVideos.clear();
      submitBtnEl.disabled = true;

      statusEl.textContent = "正在加载课程视频...";
      statusEl.className = "status loading";

      try {
        const resp = await api(`/api/pkuvideofullclass/courses/${courseId}/videos`);
        if (resp.success && resp.videos && resp.videos.length > 0) {
          videoListEl.innerHTML = resp.videos.map((video, index) => `
            <div class="video-item">
              <input type="checkbox" class="video-checkbox" id="video-${index}" data-video-id="${video.id}" />
              <label for="video-${index}" class="video-title">${esc(video.title)}</label>
              <span class="video-duration">${formatDuration(video.duration)}</span>
            </div>
          `).join("");

          document.querySelectorAll(".video-checkbox").forEach(checkbox => {
            checkbox.addEventListener("change", handleVideoSelect);
          });

          selectAllEl.checked = false;
          videoSectionEl.style.display = "block";
          statusEl.textContent = "";
          statusEl.className = "status";
        } else {
          videoSectionEl.style.display = "none";
          statusEl.textContent = "该课程暂无视频";
          statusEl.className = "status";
        }
      } catch (err) {
        videoSectionEl.style.display = "none";
        statusEl.textContent = "加载视频列表失败: " + err.message;
        statusEl.className = "status error";
      }
    }

    function handleVideoSelect(e) {
      const checkbox = e.currentTarget;
      const videoId = checkbox.dataset.videoId;

      if (checkbox.checked) {
        selectedVideos.add(videoId);
      } else {
        selectedVideos.delete(videoId);
      }

      const totalVideos = document.querySelectorAll(".video-checkbox").length;
      selectAllEl.checked = selectedVideos.size === totalVideos && totalVideos > 0;
      submitBtnEl.disabled = selectedVideos.size === 0;
    }

    selectAllEl.addEventListener("change", () => {
      document.querySelectorAll(".video-checkbox").forEach(checkbox => {
        checkbox.checked = selectAllEl.checked;
        const videoId = checkbox.dataset.videoId;
        if (selectAllEl.checked) {
          selectedVideos.add(videoId);
        } else {
          selectedVideos.delete(videoId);
        }
      });
      submitBtnEl.disabled = !selectAllEl.checked;
    });

    function formatDuration(seconds) {
      if (!seconds || isNaN(seconds)) return "未知";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) {
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    refreshBtnEl.addEventListener("click", loadCourseList);

    document.getElementById("goAppBtn").addEventListener("click", () => {
      location.href = "/app";
    });

    submitBtnEl.addEventListener("click", async () => {
      if (!selectedCourse || selectedVideos.size === 0) return;

      statusEl.textContent = "正在提交批量任务...";
      statusEl.className = "status loading";
      submitBtnEl.disabled = true;

      try {
        const resp = await api("/api/pkuvideofullclass/batch-submit", "POST", {
          course_id: selectedCourse,
          video_ids: Array.from(selectedVideos)
        });

        if (resp.success) {
          statusEl.textContent = "批量任务提交成功！任务ID: " + resp.job_id;
          statusEl.className = "status success";
        } else {
          statusEl.textContent = resp.message || "提交失败";
          statusEl.className = "status error";
        }
      } catch (err) {
        statusEl.textContent = "提交失败: " + err.message;
        statusEl.className = "status error";
      } finally {
        submitBtnEl.disabled = selectedVideos.size === 0;
      }
    });

    checkLogin();
    checkBinding();
    loadCourseList();
  </script>
</body>
</html>
