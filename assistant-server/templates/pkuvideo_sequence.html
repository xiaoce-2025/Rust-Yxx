<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>「严小希」小助手-课程回放批量处理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,600,800&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13241d;
      --line: rgba(19,36,29,.18);
      --accent: #0c7a57;
      --warn: #982a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(50rem 20rem at -10% -10%, rgba(181,91,35,.2), transparent 60%),
        radial-gradient(60rem 26rem at 110% 110%, rgba(12,122,87,.2), transparent 60%),
        #edf3ed;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 38px rgba(0,0,0,.1);
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 30px;
    }
    .sub { margin-top: 6px; color: #4f645b; font-size: 13px; }
    .toolbar { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    button.ghost {
      color: var(--ink);
      background: rgba(255,255,255,.8);
      border: 1px solid var(--line);
    }
    button.small {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 16px;
    }
    .course-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .course-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }
    .course-item:hover {
      border-color: var(--accent);
      background: rgba(12,122,87,.05);
    }
    .course-item.selected {
      border-color: var(--accent);
      background: rgba(12,122,87,.1);
    }
    .course-title {
      font-weight: 600;
      font-size: 14px;
    }
    .course-info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .status { margin-top: 10px; min-height: 18px; font-size: 12px; }
    .status.error { color: var(--warn); }
    .status.success { color: var(--accent); }
    .status.loading { color: #f59e0b; }
    .loading-spinner {
      border: 3px solid rgba(12,122,87,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .lesson-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      gap: 12px;
    }
    .lesson-item.processed {
      background: rgba(12,122,87,.05);
    }
    .lesson-datetime {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
      padding-right: 12px;
      border-right: 1px solid var(--line);
    }
    .lesson-date {
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
    }
    .lesson-time-row {
      display: flex;
      gap: 8px;
    }
    .lesson-time {
      font-size: 12px;
      color: #6b7280;
    }
    .lesson-day {
      font-size: 12px;
      color: var(--accent);
    }
    .lesson-info {
      flex: 1;
    }
    .lesson-title {
      font-weight: 600;
      font-size: 14px;
    }
    .lesson-status {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }
    .lesson-actions {
      display: flex;
      gap: 8px;
    }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
    .course-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .semester-select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; background: #fff; min-width: 180px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-weight: 600; font-size: 16px; }
    .config-section {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      padding: 16px;
    }
    .config-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .config-title .toggle-icon {
      transition: transform 0.2s;
      font-size: 14px;
    }
    .config-title.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .config-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    .config-content.collapsed {
      max-height: 0;
    }
    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .config-row:last-child {
      margin-bottom: 0;
    }
    .config-group {
      display: flex;
      flex-direction: column;
    }
    .config-group label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .config-group input {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
    }
    .config-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .config-group .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .config-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .config-actions button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }
    .config-status {
      margin-top: 8px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .config-status.success { color: var(--accent); background: rgba(12,122,87,.1); }
    .config-status.error { color: var(--warn); background: rgba(152,42,61,.1); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>课程回放批量处理</h1>
    <div class="sub">自动获取北大教学网课程列表，批量处理课程的全部回放视频。</div>

    <div class="toolbar">
      <button id="goAppBtn" class="ghost">返回聊天主页</button>
      <button id="refreshBtn" class="ghost">刷新课程列表</button>
      <button id="toggleConfigBtn" class="ghost">API配置</button>
    </div>

    <div id="status" class="status"></div>

    <!-- API配置区域 -->
    <div class="config-section" id="configSection" style="display: none;">
      <div class="config-title" id="configTitle" onclick="toggleConfig()">
        <span>API配置</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="config-content" id="configContent">
        <div class="config-row">
          <div class="config-group">
            <label>阿里云模型名称</label>
            <input type="text" id="aliyunModel" placeholder="如: paraformer-v1" />
            <span class="hint">留空则使用全局默认配置</span>
          </div>
          <div class="config-group">
            <label>阿里云 API Key</label>
            <input type="password" id="aliyunApiKey" placeholder="输入后不可查看" />
            <span class="hint">仅用于覆盖全局配置</span>
          </div>
        </div>
        <div class="config-row">
          <div class="config-group">
            <label>DeepSeek 模型名称</label>
            <input type="text" id="deepseekModel" placeholder="如: deepseek-v4-flash" />
            <span class="hint">留空则使用全局默认配置</span>
          </div>
          <div class="config-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="deepseekApiKey" placeholder="输入后不可查看" />
            <span class="hint">仅用于覆盖全局配置</span>
          </div>
        </div>
        <div class="config-actions">
          <button id="saveConfigBtn" class="ghost">保存配置</button>
          <button id="clearConfigBtn" class="ghost" style="background: rgba(152,42,61,.1); color: var(--warn);">清除自定义配置</button>
        </div>
        <div id="configStatus" class="config-status" style="display: none;"></div>
      </div>
    </div>

    <div class="card" id="courseSection">
      <div class="course-header">
        <strong>选择课程</strong>
        <select id="semesterSelect" class="semester-select">
          <option value="">加载中...</option>
        </select>
      </div>
      <div id="courseList" class="course-list">
        <div class="status loading">
          <span class="loading-spinner"></span>正在加载课程列表...
        </div>
      </div>
    </div>

    <div class="card" id="lessonSection" style="display: none;">
      <div class="section-header">
        <div class="section-title" id="lessonSectionTitle">课节列表</div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="backBtn" class="ghost small">返回</button>
          <button id="processAllBtn" class="ghost small">处理全部课节</button>
          <button id="downloadAllBtn" class="ghost small" style="display: none;">下载完整PDF</button>
        </div>
      </div>
      <div id="lessonList" class="lesson-list"></div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const courseListEl = document.getElementById("courseList");
    const lessonSectionEl = document.getElementById("lessonSection");
    const lessonListEl = document.getElementById("lessonList");
    const refreshBtnEl = document.getElementById("refreshBtn");
    const semesterSelectEl = document.getElementById("semesterSelect");
    const backBtnEl = document.getElementById("backBtn");
    const processAllBtnEl = document.getElementById("processAllBtn");
    const downloadAllBtnEl = document.getElementById("downloadAllBtn");
    const lessonSectionTitleEl = document.getElementById("lessonSectionTitle");

    let selectedCourse = null;
    let selectedCourseName = null;
    let allCourses = [];
    let currentLessons = [];
    let isProcessing = false;
    let processingLessonId = null;
    let downloadingLessonId = null;

    function setProcessing(processing) {
      isProcessing = processing;
      document.querySelectorAll('button').forEach(btn => {
        const id = btn.id;
        // 允许刷新和返回按钮始终可用
        if (id !== 'refreshBtn' && id !== 'backBtn' && id !== 'goAppBtn') {
          btn.disabled = processing;
        }
      });
    }

    async function api(path, method = "GET", body) {
      const res = await fetch(path, {
        method,
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const txt = await res.text();
      let payload = {};
      try { payload = txt ? JSON.parse(txt) : {}; } catch { payload = { raw: txt }; }
      if (!res.ok) throw new Error(payload.error || payload.raw || ("HTTP " + res.status));
      return payload;
    }

    async function checkLogin() {
      try {
        await api("/api/auth/me");
      } catch {
        location.href = "/auth?next=/pkuvideo_sequence";
      }
    }

    async function checkBinding() {
      try {
        const resp = await api("/api/pkuvideofullclass/binding-status");
        if (!resp.is_bound) {
          location.href = "/pkuvideofullclass?callback=/pkuvideo_sequence";
        }
      } catch (err) {
        statusEl.textContent = "检测绑定状态失败: " + err.message;
        statusEl.className = "status error";
      }
    }

    async function loadCourseList() {
      courseListEl.innerHTML = '<div class="status loading"><span class="loading-spinner"></span>正在加载课程列表...</div>';
      statusEl.textContent = "";

      try {
        const resp = await api("/api/pkuvideofullclass/courses");
        if (resp.success && resp.courses && resp.courses.length > 0) {
          allCourses = resp.courses;
          populateSemesterSelect(allCourses);
          renderCourses(allCourses);
        } else {
          allCourses = [];
          semesterSelectEl.innerHTML = '<option value="">无可用学期</option>';
          courseListEl.innerHTML = '<div class="status">未找到课程，请确认已正确绑定IAAA账号</div>';
        }
      } catch (err) {
        allCourses = [];
        courseListEl.innerHTML = '';
        statusEl.textContent = "加载课程列表失败: " + err.message;
        statusEl.className = "status error";
      }
    }

    function populateSemesterSelect(courses) {
      const semesters = [...new Set(courses.map(c => c.term).filter(t => t))];
      const sortedSemesters = sortSemesters(semesters);

      let optionsHtml = '<option value="">全部学期</option>' +
        sortedSemesters.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      semesterSelectEl.innerHTML = optionsHtml;

      if (sortedSemesters.length > 0) {
        semesterSelectEl.value = sortedSemesters[0];
      }
    }

    function sortSemesters(semesters) {
      return semesters.sort((a, b) => {
        const matchA = a.match(/(\d{2})-(\d{2})学年.*?(第(\d+)学期)/);
        const matchB = b.match(/(\d{2})-(\d{2})学年.*?(第(\d+)学期)/);

        if (!matchA || !matchB) {
          return a.localeCompare(b);
        }

        const yearA = parseInt(matchA[1]);
        const yearB = parseInt(matchB[1]);
        const termA = parseInt(matchA[4]);
        const termB = parseInt(matchB[4]);

        if (yearB !== yearA) {
          return yearB - yearA;
        }

        return termB - termA;
      });
    }

    function renderCourses(courses) {
      const selectedTerm = semesterSelectEl.value;
      const filtered = selectedTerm ? courses.filter(c => c.term === selectedTerm) : courses;
      if (filtered.length === 0) {
        courseListEl.innerHTML = '<div class="status">该学期暂无课程</div>';
        return;
      }
      courseListEl.innerHTML = filtered.map(course => `
        <div class="course-item" data-course-id="${course.key}" data-course-name="${esc(course.name)}">
          <div class="course-title">${esc(course.name)}</div>
          <div class="course-info">学期: ${course.term}</div>
        </div>
      `).join("");
      document.querySelectorAll(".course-item").forEach(item => {
        item.addEventListener("click", handleCourseSelect);
      });
    }

    semesterSelectEl.addEventListener("change", () => renderCourses(allCourses));

    function esc(s) {
      return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    async function handleCourseSelect(e) {
      const courseItem = e.currentTarget;
      const courseId = courseItem.dataset.courseId;
      const courseName = courseItem.dataset.courseName;

      selectedCourse = courseId;
      selectedCourseName = courseName;

      statusEl.textContent = "正在加载课节列表...";
      statusEl.className = "status loading";

      try {
        const resp = await api(`/api/pkuvideofullclass/courses/${courseId}/videos`);
        if (resp.success) {
          currentLessons = resp.lessons || [];

          // 恢复处理状态：如果后端有正在处理的课节，自动开始轮询
          if (resp.processing_video_id) {
            processingLessonId = resp.processing_video_id;
            setProcessing(true);
            renderLessonList(resp);
            statusEl.textContent = "检测到正在处理的课节，等待完成...";
            statusEl.className = "status loading";
            // 异步轮询，不阻塞页面交互
            pollProcessStatus(resp.processing_video_id, courseId).finally(() => {
              setProcessing(false);
              if (processingLessonId === resp.processing_video_id) {
                processingLessonId = null;
              }
              renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
            });
          } else {
            processingLessonId = null;
            renderLessonList(resp);
          }
        } else {
          currentLessons = [];
          processingLessonId = null;
          renderLessonList({ lessons: [], total: 0, processed: 0 });
        }
      } catch (err) {
        currentLessons = [];
        processingLessonId = null;
        statusEl.textContent = "加载课节列表失败: " + err.message;
        statusEl.className = "status error";
        renderLessonList({ lessons: [], total: 0, processed: 0 });
      }
    }

    function renderLessonList(resp) {
      const lessons = resp.lessons || [];
      const total = resp.total || 0;
      const processed = resp.processed || 0;
      const hasProcessed = lessons.some(lesson => lesson.tex_filename);

      lessonSectionTitleEl.textContent = selectedCourseName || "课节列表";

      if (lessons.length === 0) {
        lessonListEl.innerHTML = '<div class="status">暂无课节信息，请点击"刷新课节列表"按钮获取</div>';
      } else {
        lessonListEl.innerHTML = lessons.map((lesson, index) => {
          const isProcessingThisLesson = processingLessonId === lesson.id;
          const isDownloadingThisLesson = downloadingLessonId === lesson.id;
          return `
            <div class="lesson-item ${lesson.is_processed ? 'processed' : ''}">
              <div class="lesson-datetime">
                <div class="lesson-date">${esc(lesson.date)}</div>
                <div class="lesson-time-row">
                  <span class="lesson-day">${esc(lesson.day_of_week)}</span>
                  <span class="lesson-time">${esc(lesson.time)}</span>
                </div>
              </div>
              <div class="lesson-info">
                <div class="lesson-title">第${index + 1}节</div>
                <div class="lesson-status">
                  ${isProcessingThisLesson ? '处理中...' : (isDownloadingThisLesson ? '生成PDF中...' : (lesson.is_processed ? '已处理' : '未处理'))}
                </div>
              </div>
              <div class="lesson-actions">
                ${isProcessingThisLesson ? '<span class="status processing" style="padding: 4px 8px;">处理中...</span>' : ''}
                ${isDownloadingThisLesson ? '<span class="status processing" style="padding: 4px 8px;">生成中...</span>' : ''}
                ${!isProcessingThisLesson && !isDownloadingThisLesson && !lesson.tex_filename ? '<button class="ghost small" onclick="handleProcessLesson(\'' + lesson.id + '\')">提交处理</button>' : ''}
                ${!isProcessingThisLesson && !isDownloadingThisLesson && lesson.tex_filename ? '<button class="ghost small" onclick="handleReprocessLesson(\'' + lesson.id + '\')">重新处理</button>' : ''}
                ${!isProcessingThisLesson && !isDownloadingThisLesson && lesson.tex_filename ? '<button class="ghost small" onclick="handleDownloadTex(\'' + lesson.id + '\')">下载tex</button>' : ''}
                ${!isProcessingThisLesson && !isDownloadingThisLesson && lesson.tex_filename ? '<button class="ghost small" onclick="handleDownloadPdf(\'' + lesson.id + '\')">下载PDF</button>' : ''}
              </div>
            </div>
          `;
        }).join("");
      }

      downloadAllBtnEl.style.display = hasProcessed ? 'inline-block' : 'none';
      statusEl.textContent = "";
      statusEl.className = "status";

      document.getElementById("courseSection").style.display = "none";
      lessonSectionEl.style.display = "block";
      refreshBtnEl.textContent = "刷新课节列表";
    }

    function handleBack() {
      selectedCourse = null;
      selectedCourseName = null;
      currentLessons = [];

      lessonSectionEl.style.display = "none";
      document.getElementById("courseSection").style.display = "block";
      refreshBtnEl.textContent = "刷新课程列表";
    }

    backBtnEl.addEventListener("click", handleBack);

    async function refreshLessonList() {
      if (!selectedCourse) return;

      refreshBtnEl.disabled = true;
      statusEl.textContent = "正在刷新课节列表...";
      statusEl.className = "status loading";

      try {
        const resp = await api(`/api/pkuvideofullclass/courses/${selectedCourse}/videos/refresh`, "POST");
        if (resp.success) {
          statusEl.textContent = resp.message || "刷新成功";
          statusEl.className = "status success";
          await handleCourseSelect({ currentTarget: { dataset: { courseId: selectedCourse, courseName: selectedCourseName } } });
        } else {
          statusEl.textContent = resp.message || "刷新失败";
          statusEl.className = "status error";
        }
      } catch (err) {
        statusEl.textContent = "刷新失败: " + err.message;
        statusEl.className = "status error";
      } finally {
        refreshBtnEl.disabled = false;
      }
    }

    // 轮询任务处理状态（可复用于提交后轮询和页面恢复轮询）
    // courseId 作为参数传入，避免异步执行时 selectedCourse 已改变
    async function pollProcessStatus(lessonId, courseId) {
      courseId = courseId || selectedCourse;
      const maxPolls = 1200; // 最多轮询1小时 (3秒间隔)
      for (let i = 0; i < maxPolls; i++) {
        await new Promise(r => setTimeout(r, 3000));

        // 如果用户已切换到其他课程，停止轮询
        if (selectedCourse !== courseId) {
          console.log("课程已切换，停止轮询");
          return;
        }

        try {
          const statusResp = await api(`/api/pkuvideofullclass/courses/${courseId}/videos/${lessonId}/process-status`);

          if (statusResp.status === "completed") {
            statusEl.textContent = "处理完成";
            statusEl.className = "status success";

            // 重新加载课节数据以获取最新的tex_filename
            try {
              const lessonsResp = await api(`/api/pkuvideofullclass/courses/${courseId}/videos`);
              if (lessonsResp.lessons) {
                currentLessons = lessonsResp.lessons;
                processingLessonId = lessonsResp.processing_video_id || null;
              }
            } catch (e) {
              const lessonIndex = currentLessons.findIndex(l => l.id === lessonId);
              if (lessonIndex !== -1) {
                currentLessons[lessonIndex].is_processed = true;
              }
              processingLessonId = null;
            }

            renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
            return;
          } else if (statusResp.status === "failed") {
            statusEl.textContent = "处理失败: " + (statusResp.message || "未知错误");
            statusEl.className = "status error";
            processingLessonId = null;
            renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
            return;
          } else if (statusResp.status === "idle") {
            // 后端已无处理状态，刷新列表确认最终结果
            try {
              const lessonsResp = await api(`/api/pkuvideofullclass/courses/${courseId}/videos`);
              if (lessonsResp.lessons) {
                currentLessons = lessonsResp.lessons;
              }
              processingLessonId = lessonsResp.processing_video_id || null;
            } catch (e) { /* ignore */ }
            if (!processingLessonId) {
              statusEl.textContent = "处理完成";
              statusEl.className = "status success";
              renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
              return;
            }
          } else {
            statusEl.textContent = statusResp.message || "正在处理...";
            statusEl.className = "status loading";
          }
        } catch (pollErr) {
          console.warn("轮询状态失败:", pollErr);
        }
      }
      // 超时
      processingLessonId = null;
      statusEl.textContent = "处理超时，请刷新页面查看结果";
      statusEl.className = "status error";
      renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
    }

    async function handleProcessLesson(lessonId) {
      if (isProcessing) {
        statusEl.textContent = "请等待当前操作完成";
        statusEl.className = "status error";
        return;
      }
      if (!selectedCourse) {
        statusEl.textContent = "请先选择课程";
        statusEl.className = "status error";
        return;
      }

      // 立即更新UI，显示处理中
      setProcessing(true);
      processingLessonId = lessonId;
      renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
      statusEl.textContent = "正在提交任务...";
      statusEl.className = "status loading";

      try {
        // 步骤1: 提交任务（立即返回）
        const resp = await api(`/api/pkuvideofullclass/courses/${selectedCourse}/videos/${lessonId}/process`, "POST");

        if (!resp.success) {
          statusEl.textContent = resp.message || "提交失败";
          statusEl.className = "status error";
          setProcessing(false);
          processingLessonId = null;
          renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
          return;
        }

        statusEl.textContent = "任务已提交，正在后台处理...";
        statusEl.className = "status loading";

        // 步骤2: 轮询等待处理完成
        await pollProcessStatus(lessonId, selectedCourse);
      } catch (err) {
        statusEl.textContent = "处理失败: " + err.message;
        statusEl.className = "status error";
      } finally {
        setProcessing(false);
        // 仅当 polling 没有再设置 processingLessonId 时才清空
        // (pollProcessStatus 内部可能已根据后端状态更新了 processingLessonId)
        if (processingLessonId === lessonId) {
          processingLessonId = null;
        }
        renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
      }
    }

    async function handleDownloadPdf(lessonId) {
      if (isProcessing) {
        statusEl.textContent = "请等待当前操作完成";
        statusEl.className = "status error";
        return;
      }
      
      // 立即更新UI，显示生成中
      setProcessing(true);
      downloadingLessonId = lessonId;
      renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
      statusEl.textContent = "正在生成PDF...";
      statusEl.className = "status processing";
      
      try {
        const response = await fetch(`/api/pkuvideofullclass/courses/${selectedCourse}/videos/${lessonId}/download-pdf`, {
          method: 'GET',
          credentials: 'include'
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '下载失败');
        }
        
        const blob = await response.blob();
        const contentDisposition = response.headers.get('Content-Disposition');
        let filename = 'lecture_notes.pdf';
        
        if (contentDisposition) {
          const match = contentDisposition.match(/filename="?([^"]+)"?/);
          if (match) {
            filename = match[1];
          }
        }
        
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
        statusEl.textContent = "PDF下载完成";
        statusEl.className = "status success";
      } catch (error) {
        console.error('下载PDF失败:', error);
        statusEl.textContent = "下载PDF失败: " + error.message;
        statusEl.className = "status error";
      } finally {
        setProcessing(false);
        downloadingLessonId = null;
        renderLessonList({ lessons: currentLessons, total: currentLessons.length, processed: currentLessons.filter(l => l.is_processed).length });
      }
    }

    async function handleReprocessLesson(lessonId) {
      if (!confirm("确定要重新处理该课节吗？旧的tex文件将被删除。")) return;

      try {
        statusEl.textContent = "正在重置处理状态...";
        statusEl.className = "status loading";

        const resp = await api(`/api/pkuvideofullclass/courses/${selectedCourse}/videos/${lessonId}/reprocess`, "POST");

        statusEl.textContent = resp.message || "已重置处理状态";
        statusEl.className = "status success";

        // 刷新课节列表
        await handleCourseSelect({ currentTarget: { dataset: { courseId: selectedCourse, courseName: selectedCourseName } } });
      } catch (error) {
        console.error('重新处理失败:', error);
        statusEl.textContent = "重新处理失败: " + error.message;
        statusEl.className = "status error";

    downloadAllBtnEl.addEventListener("click", handleDownloadCoursePdf);

    refreshBtnEl.addEventListener("click", () => {
      if (selectedCourse) {
        refreshLessonList();
      } else {
        refreshCourseList();
      }
    });

    async function refreshCourseList() {
      refreshBtnEl.disabled = true;
      statusEl.textContent = "正在刷新课程列表...";
      statusEl.className = "status loading";

      try {
        const resp = await api("/api/pkuvideofullclass/courses/refresh", "POST");
        if (resp.success) {
          statusEl.textContent = resp.message;
          statusEl.className = "status success";
          loadCourseList();
        } else {
          statusEl.textContent = resp.message || "刷新失败";
          statusEl.className = "status error";
        }
      } catch (err) {
        statusEl.textContent = "刷新失败: " + err.message;

    document.getElementById("goAppBtn").addEventListener("click", () => {
      location.href = "/app";
    });

    // ===== API配置相关 =====
    let apiConfigExpanded = true;

    function toggleConfig() {
      const title = document.getElementById("configTitle");
      const content = document.getElementById("configContent");
      apiConfigExpanded = !apiConfigExpanded;
      if (apiConfigExpanded) {
        title.classList.remove("collapsed");
        content.classList.remove("collapsed");
      } else {
        title.classList.add("collapsed");
        content.classList.add("collapsed");
      }
    }

    document.getElementById("toggleConfigBtn").addEventListener("click", () => {
      const configSection = document.getElementById("configSection");
      if (configSection.style.display === "none") {
        configSection.style.display = "block";
        loadApiConfig();
      } else {
        toggleConfig();
      }
    });

    async function loadApiConfig() {
      try {
        const resp = await api("/api/user/api-config");
        document.getElementById("aliyunModel").value = resp.aliyun_model || "";
        document.getElementById("deepseekModel").value = resp.deepseek_model || "";
        // API Key不可查看，只显示placeholder提示
        if (resp.aliyun_api_key_set) {
          document.getElementById("aliyunApiKey").placeholder = "已设置（输入新值可更新）";
        }
        if (resp.deepseek_api_key_set) {
          document.getElementById("deepseekApiKey").placeholder = "已设置（输入新值可更新）";
        }
      } catch (err) {
        showConfigStatus("加载配置失败: " + err.message, "error");
      }
    }

    function showConfigStatus(msg, type) {
      const el = document.getElementById("configStatus");
      el.textContent = msg;
      el.className = "config-status " + type;
      el.style.display = "block";
      setTimeout(() => {
        el.style.display = "none";
      }, 3000);
    }

    document.getElementById("saveConfigBtn").addEventListener("click", async () => {
      const aliyunModel = document.getElementById("aliyunModel").value.trim() || null;
      const aliyunApiKey = document.getElementById("aliyunApiKey").value.trim() || null;
      const deepseekModel = document.getElementById("deepseekModel").value.trim() || null;
      const deepseekApiKey = document.getElementById("deepseekApiKey").value.trim() || null;

      try {
        await api("/api/user/api-config", "POST", {
          aliyun_model: aliyunModel,
          aliyun_api_key: aliyunApiKey,
          deepseek_model: deepseekModel,
          deepseek_api_key: deepseekApiKey
        });
        showConfigStatus("配置已保存", "success");
        // 清空密码输入框
        document.getElementById("aliyunApiKey").value = "";
        document.getElementById("deepseekApiKey").value = "";
        document.getElementById("aliyunApiKey").placeholder = "已设置（输入新值可更新）";
        document.getElementById("deepseekApiKey").placeholder = "已设置（输入新值可更新）";
      } catch (err) {
        showConfigStatus("保存失败: " + err.message, "error");
      }
    });

    document.getElementById("clearConfigBtn").addEventListener("click", async () => {
      if (!confirm("确定要清除所有自定义API配置吗？")) return;
      try {
        await api("/api/user/api-config", "POST", {
          aliyun_model: "",
          aliyun_api_key: "",
          deepseek_model: "",
          deepseek_api_key: ""
        });
        showConfigStatus("已清除自定义配置", "success");
        document.getElementById("aliyunModel").value = "";
        document.getElementById("aliyunApiKey").value = "";
        document.getElementById("deepseekModel").value = "";
        document.getElementById("deepseekApiKey").value = "";
        document.getElementById("aliyunApiKey").placeholder = "输入后不可查看";
        document.getElementById("deepseekApiKey").placeholder = "输入后不可查看";
