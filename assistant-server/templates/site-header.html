<header class="site-header">
  <div class="site-header-inner">
    <span class="site-header-brand">「严小希」小助手</span>
    <nav class="site-header-nav" aria-label="主要功能">
      <a href="/">首页</a>
      <a href="/pkuvideo_sequence">课程回放批量处理</a>
      <a href="/pkuvideo">课堂笔记生成</a>
      <a href="/pkuvideo_fw">回放中转与翻译</a>
    </nav>
    <details class="site-account">
      <summary><span id="site-username">账户</span><span aria-hidden="true">⌄</span></summary>
      <div class="site-account-menu"><a href="/user-center">用户中心</a><a id="site-admin-link" href="/admin" hidden>管理后台</a></div>
    </details>
  </div>
</header>
<script>
  window.siteAccount = fetch('/api/auth/me', { cache: 'no-store' })
    .then(response => response.ok ? response.json() : null)
    .catch(() => null);
  window.siteAccount.then(account => {
    if (account) document.getElementById('site-username').textContent = account.username;
    if (account?.is_admin) document.getElementById('site-admin-link').removeAttribute('hidden');
  });
</script>
